<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulacro de examen teórico promocional</title>
<style>
:root { --bg:#fbeef4; --surface:#ffffff; --ink:#3b0a1f; --muted:#7a3b56; --line:#eec3d5; --accent:#9d174d; --accent-ink:#ffffff; --ok:#166534; --ok-bg:#dcf5e4; --bad:#9f1239; --bad-bg:#fde1ea; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#2a0d1c; --surface:#3d1529; --ink:#fbe7f0; --muted:#e0a8c2; --line:#6b2d4d; --accent:#db2777; --accent-ink:#ffffff; --ok:#86efac; --ok-bg:#14402a; --bad:#fda4af; --bad-bg:#5a1a2e; }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',sans-serif; font-size:16px; line-height:1.55; }
main { max-width:720px; margin:0 auto; padding:24px 16px 60px; }
h1 { font-size:1.5rem; margin:0 0 14px; color:var(--accent); }
.card { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:14px; }
.muted { color:var(--muted); font-size:.92rem; }
.stem { font-weight:600; font-size:1.05rem; margin:0 0 14px; }
label.opt { display:flex; gap:8px; align-items:center; margin:8px 0; cursor:pointer; }
input[type=checkbox] { accent-color:var(--accent); width:18px; height:18px; }
button { font:inherit; color:inherit; cursor:pointer; display:block; width:100%; text-align:left; background:transparent; border:1.5px solid var(--line); border-radius:8px; padding:11px 14px; margin-bottom:8px; }
button.pri { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); text-align:center; font-weight:600; width:auto; display:inline-block; }
button.ok { border-color:var(--ok); background:var(--ok-bg); }
button.bad { border-color:var(--bad); background:var(--bad-bg); }
button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
.fb { padding:12px 14px; border-left:5px solid var(--accent); background:var(--bg); border-radius:0 8px 8px 0; margin:10px 0 12px; }
.fb.ok-f { border-left-color:var(--ok); }
.fb.bad-f { border-left-color:var(--bad); }
.wrong p { margin:6px 0; }
.topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; }
.topbar .muted { margin:0; }
button.sec { width:auto; display:inline-block; padding:6px 12px; margin:0; font-size:.9rem; color:var(--muted); border-color:var(--line); }
.sep { border:0; border-top:1px solid var(--line); margin:12px 0; }
.err { color:var(--bad); background:var(--bad-bg); border:1px solid var(--bad); border-radius:8px; padding:8px 12px; font-size:.92rem; margin:10px 0 0; }
.actions { margin-top:14px; }
</style>
</head>
<body>
<main id="app"></main>
<script>
var EJES = [{"n": 1, "title": "Introducción a Bases de Datos y SGBD", "qs": [{"s": "Desde la perspectiva conceptual y técnica de la disciplina, ¿cuál es la definición más precisa de una Base de Datos?", "o": ["Una colección estructurada de datos persistentes, independientes de las aplicaciones y del soporte físico, compartidos por múltiples usuarios con mínima redundancia.", "Un repositorio de archivos secuenciales y directos gestionado exclusivamente por el sistema operativo mediante directivas de control de acceso por contraseñas.", "Un conjunto de tablas relacionales en tercera forma normal optimizado para eliminar en su totalidad la presencia de valores nulos y claves subrogadas.", "Una aplicación cliente-servidor encargada de procesar transacciones distribuidas sacrificando las propiedades ACID en favor del principio BASE."], "a": 0, "e": "Una base de datos se define formalmente como una colección estructurada de datos persistentes, independientes de las aplicaciones y del soporte físico, compartidos por múltiples usuarios y aplicaciones, con una redundancia mínima y controlada. La opción b describe un sistema tradicional de archivos administrado por el sistema operativo, no una base de datos. La opción c confunde la teoría relacional con formas normales e introduce restricciones falsas (las bases de datos admiten nulos). La opción d se refiere a características de ciertos sistemas distribuidos NoSQL, no a la definición general de base de datos."}, {"s": "En los sistemas tradicionales basados en procesamiento de archivos convencionales, ¿cuál era una de las principales dificultades operativas que motivó el surgimiento de los SGBD?", "o": ["La imposibilidad física de almacenar registros de texto en memorias secundarias magnéticas.", "La dependencia entre los programas de aplicación y la estructura física de almacenamiento de los datos.", "La falta de soporte de lenguajes procedimentales de alto nivel como COBOL o Fortran.", "El requerimiento obligatorio de definir esquemas relacionales normalizados antes de procesar transacciones."], "a": 1, "e": "La limitación crítica de los sistemas de procesamiento de archivos convencionales radicaba en el estrecho acoplamiento y dependencia entre la estructura física de almacenamiento de los registros y los programas de aplicación que los leían. Cualquier cambio en la longitud de un campo o formato de archivo obligaba a reescribir y recompilar todo el software. La opción a es falsa porque los medios magnéticos almacenaban texto sin problemas. La opción c es incorrecta ya que COBOL y Fortran fueron los lenguajes principales de esa era. La opción d es anacrónica; el modelo relacional y la normalización surgieron precisamente para superar los sistemas de archivos."}, {"s": "Respecto a los conceptos de datos, información y metadatos dentro de un SGBD: \"Los metadatos son hechos brutos sin significado inherente utilizados únicamente para almacenar transacciones temporales\".", "o": ["Verdadero, ya que representan la instancia dinámica que varía constantemente con cada inserción en el sistema.", "Verdadero, porque carecen de estructura semántica hasta que son procesados por el compilador DML del gestor.", "Falso, pues los metadatos son datos que describen la estructura, restricciones y contexto de otros datos, almacenados en el catálogo.", "Falso, debido a que los metadatos se eliminan automáticamente del diccionario una vez compiladas las sentencias DDL."], "a": 2, "e": "La afirmación es falsa. Los metadatos son \"datos que describen a otros datos\", proporcionando la definición formal de los tipos, nombres de tablas, columnas, relaciones e integridad, y residen de forma permanente en el diccionario de datos o catálogo del sistema. Las opciones a y b validan erróneamente una definición falsa (los datos brutos sin procesar son datos operativos, no metadatos). La opción d es falsa porque la ejecución de sentencias DDL precisamente inserta y actualiza los metadatos en el catálogo; no los destruye."}, {"s": "En la arquitectura de tres niveles para sistemas de bases de datos, ¿cuál es la función primordial del Nivel Conceptual?", "o": ["Describir la organización física de los archivos en disco, las estructuras de indexación B+ y las rutas de acceso.", "Presentar vistas personalizadas y filtradas de la información adaptadas a las necesidades de cada usuario final.", "Optimizar los parámetros de red y la memoria intermedia del buffer de entrada/salida del sistema operativo.", "Describir la estructura global de toda la base de datos desde la perspectiva de la lógica del negocio, ocultando el almacenamiento físico."], "a": 3, "e": "El nivel conceptual describe la estructura lógica y completa de toda la base de datos para una comunidad de usuarios (entidades, tipos de datos, vínculos y restricciones del negocio), prescindiendo por completo de los detalles físicos de almacenamiento en disco. La opción a corresponde al nivel interno o físico. La opción b define al nivel externo (vistas de usuario). La opción c describe funciones de bajo nivel del sistema operativo y del gestor de buffer, ajenas a la conceptualización lógica."}, {"s": "¿En qué consiste la Independencia Lógica de los Datos en un sistema de base de datos?", "o": ["En la capacidad de modificar el esquema conceptual global sin necesidad de reescribir los programas de aplicación ni las vistas externas.", "En la posibilidad de reestructurar la organización de archivos físicos o añadir índices sin alterar el esquema conceptual.", "En la separación estricta entre los permisos de lectura de los usuarios y las credenciales del Administrador de la Base de Datos (DBA).", "En la facultad del motor de base de datos de ejecutar consultas analíticas complejas sin bloquear las transacciones concurrentes."], "a": 0, "e": "La independencia lógica de datos es la capacidad de modificar el esquema conceptual (por ejemplo, agregar una nueva entidad, dividir una tabla o incorporar atributos) sin tener que alterar los esquemas externos existentes ni reescribir los programas de aplicación que no utilizan los datos modificados. La opción b describe la independencia física de datos (cambios en el nivel interno sin afectar el conceptual). Las opciones c y d describen políticas de seguridad del DBA y características del control de concurrencia, respectivamente."}, {"s": "Respecto a la dinámica estructural de un sistema de base de datos, ¿cuál de las siguientes afirmaciones describe con mayor precisión al Esquema de una Base de Datos?", "o": ["Corresponde al conjunto de datos reales almacenados en la base de datos en un instante específico de tiempo.", "Es la representación de la estructura y reglas de diseño que tiende a ser estática y rara vez se modifica.", "Es una estructura volátil que se destruye y reconstruye cada vez que el servidor del motor se reinicia.", "Define la cantidad total de transacciones concurrentes activas soportadas en el buffer pool del gestor."], "a": 1, "e": "El esquema de una base de datos es la descripción estructural abstracta y el conjunto de reglas de integridad del modelo. Su diseño tiende a ser estático o variar muy poco a lo largo del ciclo de vida del sistema. La opción a define a la \"instancia\" o \"estado\" de la base de datos (los datos concretos presentes en un momento determinado). La opción c es falsa porque el esquema es persistente en el catálogo. La opción d se refiere a parámetros de concurrencia y dimensionamiento del pool de memoria."}, {"s": "¿Cuál es la función principal del Motor de Almacenamiento (Storage Engine) dentro de la arquitectura interna de un SGBD?", "o": ["Traducir las sentencias declarativas de SQL a planes de ejecución lógicos optimizados mediante álgebra relacional.", "Almacenar las credenciales de los usuarios y verificar las políticas de seguridad y cifrado en el catálogo de metadatos.", "Interactuar directamente con el sistema de archivos del sistema operativo para gestionar el almacenamiento y recuperación física de datos.", "Generar automáticamente interfaces gráficas de usuario para la captura y validación de formularios comerciales."], "a": 2, "e": "El motor de almacenamiento (Storage Engine) es el subsistema de bajo nivel encargado de gestionar el almacenamiento persistente, interactuar con el sistema de archivos del sistema operativo y coordinar las operaciones de lectura/escritura de bloques y páginas en disco. La opción a describe las funciones del procesador y optimizador de consultas (Query Optimizer). La opción b corresponde al gestor de seguridad y autorización. La opción d describe herramientas de desarrollo de software frontend."}, {"s": "¿Qué rol asume principalmente la responsabilidad del diseño conceptual y físico, la definición de políticas de seguridad, el mantenimiento de esquemas y la optimización del rendimiento en un SGBD?", "o": ["Administrador de Bases de Datos (DBA).", "Programador de Aplicaciones.", "Usuario Especializado / Analista de Negocios.", "Usuario Final Paramétrico."], "a": 0, "e": "El Administrador de Bases de Datos (DBA) es el responsable técnico central de autorizar el acceso, supervisar el rendimiento, aplicar el diseño físico, coordinar respaldos y mantener el diccionario de datos del sistema. Los programadores de aplicaciones (opción b) desarrollan software cliente. Los analistas (opción c) consultan datos para toma de decisiones. Los usuarios finales paramétricos (opción d) operan transacciones rutinarias mediante formularios prediseñados."}, {"s": "En la evolución de los modelos de datos clásicos, ¿cuál fue la limitación arquitectónica más severa del Modelo Jerárquico frente al Modelo de Red?", "o": ["La ausencia total de conceptos de registro y campo en sus estructuras primarias de almacenamiento.", "La imposibilidad de almacenar tipos de datos numéricos enteros en las unidades de disco de la época.", "Su rigidez basada en árboles donde un registro hijo solo puede estar vinculado a un único registro padre, dificultando relaciones N:M.", "La falta de mecanismos de respaldo y recuperación basados en bitácoras de transacciones activas."], "a": 2, "e": "El modelo jerárquico organiza los datos en estructuras de árbol estricto, donde cada registro hijo puede tener únicamente un registro padre (relaciones 1:N). Esta restricción impedía representar de forma natural relaciones de muchos a muchos (N:M), limitación que el modelo de red superó al permitir que un registro tuviera múltiples dueños o padres. Las opciones a y b afirman limitaciones inexistentes, ya que los modelos jerárquicos sí poseían registros, campos y tipos numéricos. La opción d es falsa porque gestores jerárquicos como IMS de IBM contaban con mecanismos de recuperación y log transaccional."}, {"s": "¿Cuál de los siguientes fundamentos teóricos impulsó al Modelo Relacional a convertirse en el estándar predominante en la industria informática?", "o": ["El uso obligatorio de punteros y direcciones físicas en disco para recorrer las estructuras de datos.", "El acoplamiento estrecho entre los algoritmos de ordenamiento físico y los programas cliente.", "La sustitución de los esquemas conceptuales por colecciones de documentos semiestructurados jerárquicos.", "Su base en la teoría matemática formal de conjuntos y relaciones lógicas bidimensionales manipulables mediante lenguajes declarativos."], "a": 3, "e": "Edgar F. Codd fundamentó el modelo relacional en la teoría matemática formal de conjuntos y la lógica de predicados de primer orden, concibiendo los datos como tablas lógicas bidimensionales independientes del almacenamiento físico y manipulables mediante operadores algebraicos. Las opciones a y b describen los defectos de los modelos jerárquico y de red (que utilizaban punteros y dependían de rutas físicas). La opción c alude al modelo NoSQL orientado a documentos, no al relacional."}, {"s": "¿Por qué se califica al Lenguaje de Consulta Estructurado (SQL) como un lenguaje de naturaleza declarativa?", "o": ["Porque exige al programador codificar en detalle los ciclos algorítmicos y las estructuras de punteros para recuperar cada tupla.", "Porque permite al usuario especificar qué datos desea obtener sin necesidad de detallar los procedimientos físicos paso a paso para recuperarlos.", "Porque solo admite la definición de tablas y vistas (DDL), delegando la manipulación de datos a lenguajes procedimentales.", "Porque requiere declarar explícitamente la cantidad de bytes que ocupará cada registro en la memoria caché del motor."], "a": 1, "e": "SQL es un lenguaje declarativo porque el programador se limita a especificar \"qué\" conjunto de datos necesita recuperar mediante cláusulas como SELECT, FROM y WHERE, dejando en manos del optimizador del SGBD la determinación de la ruta y los algoritmos procedimentales para obtenerlos. La opción a describe un lenguaje procedimental o imperativo de bajo nivel. La opción c es incorrecta porque SQL incluye tanto DDL como DML (SELECT, INSERT, UPDATE, DELETE). La opción d confunde sentencias de consulta con asignaciones estáticas de memoria."}, {"s": "¿Cuál es una de las principales motivaciones técnicas por las cuales surgieron los sistemas gestores de bases de datos NoSQL en entornos distribuidos modernos?", "o": ["La necesidad de eliminar completamente el uso de índices secundarios en servidores de misión crítica.", "El requisito de forzar una normalización estricta hasta la Forma Normal de Boyce-Codd (FNBC) en todas las entidades.", "Manejar grandes volúmenes de datos no estructurados con alta escalabilidad horizontal, flexibilizando las garantías ACID en favor de principios BASE.", "Restringir el acceso concurrente a un único usuario a la vez para evitar colisiones en la memoria secundaria."], "a": 2, "e": "El movimiento NoSQL surgió impulsado por la necesidad de procesar grandes volúmenes de datos distribuidos (Big Data) con escalabilidad horizontal masiva, flexibilizando las garantías estrictas de consistencia inmediata de ACID en favor del modelo BASE (Basically Available, Soft-state, Eventual consistency). La opción a es falsa porque los motores NoSQL emplean índices secundarios o de partición extensivamente. La opción b contradice el paradigma NoSQL, que prioriza esquemas desnormalizados. La opción d es absurda en sistemas distribuidos que atienden miles de peticiones concurrentes."}, {"s": "En el ecosistema NoSQL, ¿cuál es el caso de uso típico para el cual está optimizado el modelo de datos Clave-Valor (como Redis o Memcached)?", "o": ["Almacenamiento y consulta de grafos densos con múltiples relaciones interconectadas y árboles de decisión.", "Gestión de transacciones bancarias que exigen consistencia inmediata estricta y bloqueos pesados de tablas completas.", "Acceso ultrarrápido a cachés y datos de sesión de usuarios mediante búsquedas directas por un identificador único.", "Almacenamiento de documentos semiestructurados en formato XML con consultas complejas de agregación multidimensional."], "a": 2, "e": "Las bases de datos clave-valor se estructuran como tablas hash distribuidas donde cada registro se identifica por una clave única. Su diseño minimalista ofrece tiempos de respuesta en submilisegundos, siendo ideales para gestión de sesiones web, carritos de compras y cachés de alta velocidad. La opción a define a las bases de datos de grafos. La opción b describe sistemas relacionales transaccionales OLTP. La opción d se refiere a motores documentales o XML."}, {"s": "¿Qué característica define esencialmente al modelo NoSQL orientado a Documentos (como MongoDB)?", "o": ["Almacena la información en formatos semiestructurados (como JSON o BSON), manteniendo datos relacionados dentro de un mismo objeto sin esquemas rígidos.", "Organiza la información en tablas bidimensionales rígidas gobernadas estrictamente por claves foráneas obligatorias.", "Requiere que todos los documentos compartan exactamente las mismas columnas y tipos de datos a lo largo de toda la colección.", "Prohíbe la indexación de los campos internos para evitar el costo de mantenimiento de estructuras B+."], "a": 0, "e": "Los sistemas orientados a documentos almacenan registros como documentos semiestructurados autocontenidos (típicamente JSON, BSON o XML). Permiten esquemas dinámicos (schema-free) donde diferentes documentos de una misma colección pueden contener atributos y anidamientos jerárquicos distintos. La opción b describe tablas relacionales con restricciones de clave externa. La opción c niega la naturaleza semiestructurada y flexible del modelo documental. La opción d es falsa puesto que motores como MongoDB admiten índices secundarios sobre cualquier campo interno del documento."}, {"s": "¿Cuál es el enfoque central de las bases de datos de Grafos (como Neo4j) que las distingue de los modelos relacionales y otros modelos NoSQL?", "o": ["Utilizan columnas anchas particionadas exclusivamente por rangos de fechas para acelerar reportes analíticos masivos.", "Modelan datos estructurados como nodos y las relaciones explícitas como aristas (bordes), optimizando la exploración de interconexiones complejas.", "Dependen de un esquema jerárquico de un solo padre por registro para evitar dependencias transitivas en el disco.", "Descartan el almacenamiento persistente en disco operando de forma exclusiva en la memoria principal del servidor."], "a": 1, "e": "En las bases de datos de grafos, las entidades se representan como nodos y las relaciones como aristas o bordes directos que conectan dichos nodos de forma explícita. Esto permite navegar por redes interconectadas complejas mediante punteros directos sin el elevado costo de procesamiento de múltiples JOIN relacionales. La opción a describe bases de datos columnares (como Cassandra o HBase). La opción c hace referencia al modelo jerárquico clásico. La opción d describe bases de datos exclusivamente en memoria (in-memory databases), mientras que motores de grafos como Neo4j almacenan datos de forma persistente en disco."}]}, {"n": 2, "title": "Diseño Conceptual y Modelo Entidad-Relación (MER / EER)", "qs": [{"s": "En la metodología clásica de diseño de bases de datos, ¿cuál es el objetivo central y alcance de la etapa de Diseño Lógico?", "o": ["Seleccionar los tipos de datos nativos del motor, diseñar las particiones de disco y configurar los índices B+.", "Transformar el esquema conceptual independiente a un esquema estructurado para un modelo de datos específico (como el relacional).", "Formular las reglas de negocio en lenguaje coloquial a partir de las entrevistas con los usuarios de la organización.", "Implementar físicamente el almacenamiento en bloques de disco y optimizar los parámetros del buffer pool."], "a": 1, "e": "El Diseño Lógico toma como entrada el esquema conceptual (independiente de cualquier SGBD) y lo mapea hacia las estructuras formales del modelo de datos de destino (típicamente tablas, claves primarias y claves foráneas en el modelo relacional). Las opciones a y d corresponden al Diseño Físico, donde se configuran tipos nativos específicos, rutas de acceso, páginas de disco e índices. La opción c describe el análisis inicial de requerimientos de los usuarios."}, {"s": "En el marco formal del Modelo Entidad-Relación propuesto por Peter Chen, ¿cómo se define a una entidad y a un conjunto de entidades?", "o": ["Una entidad es una función matemática entre atributos, y el conjunto de entidades define la clave primaria de la tabla.", "Una entidad es un archivo físico indexado en disco, y el conjunto de entidades es la tabla de catálogo que almacena metadatos.", "Una entidad es una restricción de integridad referencial, y el conjunto representa la lista de reglas activas en el SGBD.", "Una entidad es un objeto del mundo real distinguible de otros, y el conjunto es la colección de entidades del mismo tipo."], "a": 3, "e": "Peter Chen define formalmente una entidad como un objeto del mundo real que posee existencia propia y que es distinguible unívocamente del resto de los objetos a través de sus atributos; un conjunto de entidades agrupa a todas aquellas que comparten la misma estructura de atributos. La opción a confunde entidad con dominios y relaciones funcionales. La opción b alude a estructuras de almacenamiento secundario y diccionarios del nivel físico. La opción c confunde la definición de entidad con las restricciones de integridad del gestor."}, {"s": "En el modelado conceptual, ¿cuál de las siguientes opciones describe con exactitud la naturaleza de los atributos compuestos y derivados?", "o": ["Los compuestos se descomponen en partes más pequeñas independientes, y los derivados se calculan a partir de otros atributos existentes.", "Los compuestos admiten múltiples valores concurrentes por tupla, y los derivados representan claves foráneas obligatorias.", "Los compuestos representan exclusivamente claves externas, y los derivados no pueden almacenarse físicamente bajo ninguna condición.", "Los compuestos no pueden dividirse bajo ninguna regla, y los derivados definen el dominio numérico de la clave primaria."], "a": 0, "e": "Los atributos compuestos están formados por componentes menores con significado independiente (por ejemplo, Dirección formada por calle, número y ciudad), mientras que los derivados no se almacenan como datos base sino que su valor se deduce o computa a partir de otros (por ejemplo, calcular Edad a partir de Fecha_Nacimiento). La opción b confunde compuestos con atributos multivaluados. La opción c afirma erróneamente que son claves externas y prohíbe su almacenamiento (un derivado puede materializarse por optimización). La opción d niega la divisibilidad del atributo compuesto y confunde el concepto con dominios de claves."}, {"s": "¿Qué rol cumple conceptualmente la definición de un Dominio asociado a un atributo en un modelo de datos?", "o": ["Especificar el nombre de la tabla secundaria donde se propagará la clave externa durante el mapeo relacional.", "Establecer si la relación entre dos conjuntos de entidades admite multiplicidad de uno a muchos o muchos a muchos.", "Definir el conjunto exhaustivo de valores atómicos válidos y homogéneos que puede asumir dicho atributo.", "Determinar si el atributo participará obligatoriamente como clave candidata en el esquema físico final."], "a": 2, "e": "El dominio es el conjunto formal de todos los valores atómicos permitidos que puede tomar un atributo determinado (por ejemplo, el conjunto de cadenas de texto para un nombre o números enteros positivos para una edad), garantizando la integridad semántica y de tipo en el modelo. La opción a se refiere a las reglas de propagación de claves en el diseño lógico. La opción b describe las razones de multiplicidad o cardinalidad. La opción d confunde los valores admisibles con la selección de claves candidatas."}, {"s": "Respecto a las restricciones de unicidad e identificación en el diseño de datos, ¿cuál es la diferencia técnica fundamental entre una Superclave y una Clave Candidata?", "o": ["La superclave contiene siempre una clave externa, mientras que la clave candidata es asignada por el optimizador de consultas.", "La clave candidata es una superclave mínima, es decir, ningún subconjunto propio de sus atributos preserva la unicidad de las tuplas.", "La superclave no admite valores nulos bajo ninguna condición, mientras que la clave candidata permite nulos en todos sus componentes.", "La superclave opera exclusivamente en relaciones ternarias, mientras que la clave candidata solo se aplica en entidades débiles."], "a": 1, "e": "Toda clave candidata es una superclave, pero con la propiedad formal de ser irreducible (mínima): si se remueve cualquiera de los atributos que la componen, el conjunto resultante pierde la capacidad de identificar de manera única e inequívoca a cada tupla o entidad. La opción a introduce claves foráneas (que vinculan relaciones) de forma irrelevante. La opción c es falsa puesto que las claves candidatas prohíben valores nulos por regla de integridad de entidad. La opción d confunde jerarquías de claves con grados de relación o dependencias débiles."}, {"s": "En el Modelo Entidad-Relación, ¿qué indica el grado o aridad de un conjunto de relaciones?", "o": ["El número de tuplas físicas que se generan en la tabla intermedia tras la reducción lógica del modelo.", "La cantidad total de atributos descriptivos propios que contiene la relación en el diagrama conceptual.", "El límite máximo de instancias que una entidad particular puede asociar en un instante dado del sistema.", "El número de tipos de entidades participantes que intervienen directamente en dicho conjunto de relaciones."], "a": 3, "e": "El grado o aridad de un conjunto de relaciones indica la cantidad de conjuntos de entidades que participan en dicha asociación (grado 1 para unarias o recursivas, grado 2 para binarias, grado 3 para ternarias, etc.). La opción a hace referencia a la cardinalidad de tuplas de una instancia en el modelo relacional. La opción b mide la cantidad de atributos de la relación, no su grado. La opción c se refiere a la cardinalidad máxima de mapeo."}, {"s": "En un caso de estudio hospitalario se define: \"Un médico puede poseer varias especialidades y una especialidad puede ser ejercida por múltiples médicos\". ¿Cómo se clasifica esta relación según su cardinalidad máxima?", "o": ["Relación de muchos a muchos (N:M), donde ambas entidades participan con multiplicidad abierta en sus asociaciones.", "Relación de uno a muchos (1:N), requiriendo propagar la clave primaria de especialidad dentro de la entidad médico.", "Relación de uno a uno (1:1), obligando a fusionar ambas entidades en una tabla única durante el diseño lógico.", "Relación unaria o recursiva, puesto que ambas entidades comparten el mismo dominio formal de identificadores."], "a": 0, "e": "Dado que un médico puede asociarse con muchas especialidades y una especialidad puede ser compartida por muchos médicos, la relación entre ambas entidades es de cardinalidad máxima muchos a muchos (N:M). La opción b restringiría erróneamente a que una especialidad solo pertenezca a un único médico. La opción c forzaría a que cada médico tenga una única especialidad y viceversa. La opción d confunde la relación binaria con una recursiva (que asocia entidades de un mismo conjunto entre sí)."}, {"s": "En un sistema de recursos humanos, ¿qué significa técnicamente que la entidad EMPLEADO tenga participación total en la relación TRABAJA_EN respecto a DEPARTAMENTO?", "o": ["Que todo departamento registrado en la empresa debe tener asignados obligatoriamente a todos los empleados de la plantilla.", "Que cada empleado puede desempeñar tareas en varios departamentos a la vez sin restricciones de asignación temporal.", "Que toda instancia de la entidad empleado debe estar obligatoriamente vinculada a al menos una instancia de departamento.", "Que la entidad departamento no puede ser modificada ni eliminada sin ejecutar previamente la baja física de sus empleados."], "a": 2, "e": "La participación total (u obligatoria) exige que todas y cada una de las instancias del conjunto de entidades participen en al menos una ocurrencia del conjunto de relaciones; en este caso, ningún empleado puede existir en el sistema sin estar asignado a un departamento. La opción a invierte la regla y confunde la participación del empleado con una restricción universal sobre el departamento. La opción b alude a la cardinalidad de la relación, no a su participación mínima obligatoria. La opción d confunde restricciones de modelado conceptual con reglas operativas de eliminación física en cascada."}, {"s": "¿Cuál es la propiedad conceptual y estructural que distingue a una Entidad Débil en el Modelo Entidad-Relación?", "o": ["No posee atributos propios suficientes para identificarse unívocamente, dependiendo de la clave de una entidad fuerte identificadora.", "Posee una clave primaria simple e independiente, pero se subordina existencialmente a relaciones de muchos a muchos.", "Se representa gráficamente con rombos simples y solo admite atributos de naturaleza derivada en su definición formal.", "Posee existencia propia en el mundo real, pero se transforma en una vista no materializada durante el diseño relacional."], "a": 0, "e": "Las entidades débiles no tienen atributos propios que garanticen la identificación unívoca de sus instancias. Para identificarse necesitan asociarse a una entidad fuerte identificadora a través de una relación identificadora, combinando la clave primaria de la entidad fuerte con su propio discriminador o clave parcial. La opción b se contradice al afirmar que poseen claves primarias simples e independientes. La opción c es falsa respecto a la simbología (se representan con rectángulo doble y admiten atributos comunes). La opción d afirma erróneamente que carecen de materialización física o que dependen de relaciones 1:1."}, {"s": "En los diagramas conceptuales basados estrictamente en la simbología de Peter Chen, ¿cómo se grafican los atributos multivaluados y derivados?", "o": ["Los multivaluados con rectángulos dobles y los derivados con rombos punteados.", "Los multivaluados con círculos simples y los derivados con líneas dobles continuas.", "Los multivaluados con óvalos sombreados y los derivados con rectángulos simples.", "Los multivaluados con óvalos dobles y los derivados con óvalos de línea discontinua o punteada."], "a": 3, "e": "En la notación original de Chen, los atributos multivaluados se grafican con una elipse u óvalo con borde doble, mientras que los atributos derivados se denotan mediante un óvalo con línea de borde discontinua, punteada o a trazos. Los rectángulos dobles (opción a) representan entidades débiles. Las líneas dobles en las conexiones (opción b) representan participación total. Los rectángulos simples (opción c) representan entidades fuertes."}, {"s": "En el contexto del Modelo Entidad-Relación Extendido (EER), ¿en qué consiste el constructo de Especialización?", "o": ["En un proceso ascendente que fusiona entidades similares para sintetizar una superclase genérica única.", "En un proceso descendente que define subclases a partir de una superclase, heredando atributos comunes y agregando específicos.", "En la transformación algorítmica de relaciones tabulares para satisfacer la forma normal de Boyce-Codd sin pérdida.", "En la vinculación forzada de claves foráneas no nulas para impedir la presencia de tablas intermedias en el diseño."], "a": 1, "e": "La especialización es un proceso de diseño conceptual descendente (top-down) mediante el cual una superclase genérica se divide en una o más subclases específicas, las cuales heredan todos los atributos y vínculos de la superclase y aportan atributos o relaciones particulares. La opción a define al proceso inverso, que es la generalización (bottom-up). La opción c describe algoritmos de descomposición formal de normalización lógica. La opción d describe la resolución de restricciones referenciales en bases relacionales."}, {"s": "En una especialización donde la superclase PERSONA tiene subclases EMPLEADO y CLIENTE, una misma persona puede actuar simultáneamente como cliente y empleado, y además existen personas que no son ninguna de las dos. ¿Qué restricciones caracterizan a esta jerarquía?", "o": ["Disjunta (disjoint) y de participación total.", "Disjunta (disjoint) y de participación parcial.", "Solapada (overlapping) y de participación parcial.", "Solapada (overlapping) y de participación total."], "a": 2, "e": "Es solapada (overlapping) porque una misma persona puede pertenecer a más de una subclase en simultáneo (ser empleado y cliente a la vez). Es parcial porque no toda persona está obligada a ser cliente o empleado (la unión de las subclases no conforma la totalidad de la superclase). Las opciones a y b exigen disyunción (que una instancia pertenezca a lo sumo a una sola subclase, impidiendo ser ambos). Las opciones a y d exigen participación total (lo que obligaría a que toda persona sea obligatoriamente empleado o cliente)."}, {"s": "¿Cuál es la finalidad semántica fundamental del mecanismo de Agregación en el Modelo EER?", "o": ["Tratar a una relación y sus entidades participantes como una entidad de orden superior para que pueda participar en otra relación.", "Sumar matemáticamente los atributos cuantitativos de una tupla antes de propagar su clave primaria al esquema relacional.", "Convertir una relación de muchos a muchos en dos relaciones de uno a uno sin requerir la creación de tablas adicionales.", "Sustituir a las entidades débiles cuando su discriminador coincide con el tipo de datos de una clave foránea opcional."], "a": 0, "e": "El Modelo Entidad-Relación básico prohíbe conectar relaciones directamente con otras relaciones. La agregación subsana esta limitación semántica encapsulando a una relación (y sus entidades participantes) dentro de una entidad abstracta de nivel superior para que pueda actuar como participante de un nuevo conjunto de relaciones. La opción b confunde el concepto con funciones matemáticas de agregación en SQL (SUM, AVG). La opción c describe artificios de diseño relacional para multiplicidades. La opción d alude incorrectamente al tratamiento de entidades débiles."}, {"s": "Al transformar un esquema E-R al modelo relacional, ¿cuál es la regla de transformación aplicable a un atributo multivaluado (por ejemplo, telefono en la entidad EMPLEADO)?", "o": ["Se concatena en un único campo de texto dentro de la tabla EMPLEADO empleando separadores especiales.", "Se agrega una cantidad fija de columnas numeradas en la tabla principal, rellenando con valores nulos los campos vacíos.", "Se crea una nueva tabla cuya clave primaria se forma combinando la clave de la entidad propietaria y el atributo multivaluado.", "Se elimina del modelo relacional por violar la definición de relación y se recrea como un trigger en la base física."], "a": 2, "e": "El modelo relacional en su primera forma normal (1FN) prohíbe atributos con valores no atómicos. La regla algorítmica de mapeo exige crear una nueva tabla que contenga el atributo multivaluado junto a la clave primaria de la entidad original; la clave primaria de esta nueva tabla es compuesta por ambos campos. Las opciones a y b violan la 1FN al introducir listas concatenadas o columnas artificiales redundantes con nulos masivos. La opción d es falsa porque los atributos multivaluados se preservan como estructuras de tablas relacionales plenamente operativas."}, {"s": "Al mapear una relación binaria 1:N entre las entidades DEPARTAMENTO (lado 1) y EMPLEADO (lado N) al modelo relacional, ¿cuál es el procedimiento estándar de reducción?", "o": ["Crear obligatoriamente una tabla intermedia cuya clave primaria sea una clave compuesta por los identificadores de ambas tablas.", "Propagar la clave primaria del lado 1 (DEPARTAMENTO) como clave foránea dentro de la tabla del lado N (EMPLEADO).", "Propagar la clave primaria del lado N (EMPLEADO) como clave foránea dentro de la tabla del lado 1 (DEPARTAMENTO).", "Fusionar ambas entidades en una sola tabla desnormalizada gobernada por una clave foránea autorreferenciada."], "a": 1, "e": "Para representar una relación 1:N en el modelo relacional, la regla estándar dicta que la clave primaria de la entidad que se encuentra en el lado \"uno\" (DEPARTAMENTO) debe propagarse e incluirse como clave foránea (FK) dentro de la tabla que representa a la entidad del lado \"muchos\" (EMPLEADO). La opción a describe el tratamiento obligatorio de relaciones muchos a muchos (N:M); en 1:N crear una tabla intermedia resulta redundante e ineficiente. La opción c invierte la relación, forzando erróneamente a que un departamento solo pueda tener un empleado. La opción d generaría anomalías de inserción y redundancia severa al fusionar entidades independientes."}]}, {"n": 3, "title": "Modelo Relacional, Restricciones de Integridad y Álgebra Relacional", "qs": [{"s": "En el marco formal del Modelo Relacional formulado por Edgar Codd, ¿cuál es la definición matemática exacta de una relación R sobre un conjunto de dominios D₁, D₂, …, Dₙ?", "o": ["Un subconjunto del producto cartesiano D₁ × D₂ × … × Dₙ, conformado por un conjunto no ordenado de tuplas homogéneas.", "Una lista encadenada de punteros secuenciales que ordenan los registros en memoria secundaria de acuerdo con la clave primaria.", "Una función biyectiva que asocia cada atributo con una tabla del catálogo del sistema gestor de base de datos.", "Una matriz ordenada de filas y columnas donde el índice posicional de cada celda determina su significado semántico."], "a": 0, "e": "Formalmente, una relación matemática sobre los dominios D₁, D₂, …, Dₙ es un subconjunto del producto cartesiano de dichos dominios (es decir, R ⊆ D₁ × D₂ × … × Dₙ). Cada elemento de la relación es una tupla o lista ordenada de valores, y la relación en sí es un conjunto desordenado de tuplas donde no existen duplicados. La opción b describe estructuras de almacenamiento físico y listas enlazadas en disco. La opción c confunde relaciones algebraicas con el mapeo del catálogo. La opción d afirma erróneamente que las celdas dependen de un índice posicional rígido, cuando en el modelo relacional los atributos están asociados por nombre y no por orden físico."}, {"s": "En una tabla relacional EMPLEADO que contiene 8 columnas y 1.500 registros almacenados, ¿cómo se denominan y cuantifican formalmente estas dimensiones?", "o": ["Grado igual a 1.500 y cardinalidad igual a 8, donde el grado puede variar dinámicamente con cada inserción DML.", "Grado igual a 8 y cardinalidad igual a 1.500, siendo el grado una propiedad del esquema y la cardinalidad del estado.", "Grado igual a 8 y cardinalidad infinita, al no haberse alcanzado la capacidad de almacenamiento del buffer pool.", "Grado igual a 1.500 y cardinalidad igual a 8, representando ambos valores propiedades estáticas del diccionario."], "a": 1, "e": "El grado (o aridad) es el número de atributos que integran el esquema de la relación (en este caso, 8 columnas), siendo una propiedad fija del esquema. La cardinalidad es el número de tuplas o filas presentes en una instancia o estado determinado (en este caso, 1.500 tuplas), variando dinámicamente con las operaciones DML. Las opciones a y d invierten de forma equivocada los conceptos de grado y cardinalidad. La opción c confunde la cardinalidad de la instancia física actual con la capacidad de memoria del buffer."}, {"s": "En una relación existen los atributos DNI y Numero_Legajo, ambos únicos y no nulos en toda la población. Si el diseñador selecciona DNI para identificar formalmente las tuplas en el esquema, ¿qué categoría técnica asume Numero_Legajo?", "o": ["Clave foránea compuesta, debiendo propagarse obligatoriamente a todas las relaciones subordinadas.", "Superclave no mínima, perdiendo de forma irreversible su condición de unicidad en el catálogo del motor.", "Clave alternativa (o secundaria), conservando su propiedad de unicidad como clave candidata no elegida.", "Atributo derivado, quedando sujeta a validaciones mediante disparadores de inserción tardía."], "a": 2, "e": "Toda superclave mínima que cumple con la propiedad de unicidad e irreducibilidad es una clave candidata. Cuando el diseñador selecciona una de ellas como clave primaria (Primary Key), las restantes claves candidatas no seleccionadas pasan a denominarse formalmente claves alternativas (Alternate Keys) o secundarias, y deben seguir preservando la unicidad. La opción a confunde claves alternativas con claves externas. La opción b afirma erróneamente que pierde su condición de unicidad o que deja de ser mínima. La opción d confunde una clave candidata real con un atributo derivado computado."}, {"s": "Respecto a las restricciones estructurales del modelo, ¿cuál de las siguientes afirmaciones describe con mayor precisión a una Clave Externa?", "o": ["Es un atributo que debe poseer obligatoriamente el mismo nombre literal que la clave primaria de la tabla referenciada.", "Es un identificador que prohíbe de manera absoluta la existencia de valores nulos dentro de cualquier tupla de la relación.", "Es una columna calculada que acelera el procesamiento de agrupamientos en consultas con la cláusula HAVING.", "Es un atributo o conjunto de atributos cuyos valores deben coincidir con una clave candidata de otra relación o ser nulos."], "a": 3, "e": "Una clave externa (FK) es un atributo o conjunto de atributos en una relación cuyos valores deben concordar exactamente con los valores de una clave candidata o primaria existente en otra relación (o en la misma, si es reflexiva), o bien ser enteramente nula si las reglas de participación del negocio lo permiten. La opción a es incorrecta porque los nombres de las columnas pueden diferir siempre que compartan el mismo dominio subyacente. La opción b es falsa porque las claves foráneas admiten valores nulos salvo que se indique explícitamente NOT NULL. La opción c confunde la definición estructural de una clave con funciones de agregación en SQL."}, {"s": "¿Qué postula taxativamente la Regla de Integridad de Entidad en el modelo relacional formal?", "o": ["Ningún componente de la clave primaria de una relación base puede asumir un valor nulo (NULL).", "Toda clave foránea debe referenciar obligatoriamente a una tupla activa en la tabla principal del sistema.", "Todo atributo secundario debe declararse obligatoriamente con una cláusula CHECK de no negatividad.", "Ninguna relación relacional puede contener más de una clave candidata con valores duplicados en memoria."], "a": 0, "e": "La Integridad de Entidad establece que ningún valor de una clave primaria puede ser nulo (NULL), ni total ni parcialmente en caso de claves primarias compuestas. Esto se debe a que la clave primaria es el mecanismo fundamental de direccionamiento e individualización de tuplas en el universo relacional. La opción b define a la regla de Integridad Referencial. La opción c se refiere a restricciones generales de dominio empresarial. La opción d formula una prohibición inexistente e incoherente sobre claves candidatas en memoria."}, {"s": "Si en una base de datos relacional se intenta eliminar un registro de la tabla CARRERA que está referenciado por varios alumnos en la tabla ESTUDIANTE, ¿qué ocurre si la clave externa fue definida con la opción por defecto RESTRICT (o NO ACTION)?", "o": ["El motor elimina en cascada las tuplas de los estudiantes vinculados para preservar el balance relacional.", "El motor rechaza la operación de eliminación, impidiendo que existan tuplas huérfanas en la tabla de estudiantes.", "El motor actualiza automáticamente la clave externa de los estudiantes referenciados asignándoles el valor nulo.", "El motor suspende temporalmente las transacciones activas hasta que el usuario reasigne los legajos por consola."], "a": 1, "e": "La Integridad Referencial exige que no existan tuplas huérfanas con referencias no resueltas. Bajo la cláusula RESTRICT o NO ACTION, el motor evalúa la existencia de registros subordinados que apunten a la clave a eliminar y, de encontrarlos, bloquea y aborta la instrucción para mantener consistente el estado de la base de datos. La opción a describe el comportamiento de la opción CASCADE. La opción c describe la opción SET NULL. La opción d inventa un comportamiento operativo inexistente en motores relacionales estándar."}, {"s": "En la teoría relacional, ¿cuál es el significado formal de un valor NULL y cómo impacta en las operaciones de comparación lógica?", "o": ["Representa una cadena de texto vacía o el cero numérico, evaluando a falso en todas las cláusulas condicionales.", "Representa un valor fuera de rango que fuerza la recarga de la página de datos desde el disco secundario.", "Representa la ausencia de valor o valor desconocido, produciendo el valor de verdad UNKNOWN en lógica trivaluada.", "Representa un apuntador a la memoria caché del motor que optimiza la búsqueda de índices agrupados."], "a": 2, "e": "En el modelo relacional formal, NULL no denota un valor concreto sino la ausencia de dato (dato desconocido, no aplicable o no suministrado). Cualquier comparación lógica contra NULL (como = NULL o <> NULL) no puede evaluarse como verdadera ni como falsa, arrojando el valor lógico UNKNOWN bajo la lógica trivaluada de predicados de SQL. La opción a confunde NULL con literales cero o cadenas en blanco, los cuales son valores concretos almacenados. Las opciones b y d atribuyen a NULL funciones de punteros o de paginación física que no tienen relación con el concepto."}, {"s": "¿Cuál es la naturaleza y comportamiento formal del operador algebraico de Selección (denotado por la letra griega σ)?", "o": ["Es un operador que proyecta exclusivamente un subconjunto vertical de columnas eliminando los duplicados físicos.", "Es un operador binario que fusiona dos relaciones compatibles con unión mediante el producto de sus tuplas.", "Es una función de agregación encargada de sumar los valores monetarios de una relación agrupada por claves.", "Es un operador unario que actúa como filtro horizontal, seleccionando las tuplas que satisfacen un predicado lógico."], "a": 3, "e": "El operador Selección (σ _condición(R)) es una operación unaria que produce una nueva relación con el mismo grado (mismas columnas) que la relación original, pero con un subconjunto de tuplas que satisfacen la condición lógica especificada, actuando como un filtro horizontal. La opción a define al operador Proyección. La opción b alude a operadores binarios como la unión o el producto cartesiano. La opción c describe funciones de agregación (SUM, AVG), ajenas al álgebra relacional pura."}, {"s": "Al aplicar el operador de Proyección (π) sobre una relación que contiene tuplas con valores idénticos en los atributos proyectados, ¿cuál es el resultado según la definición formal del álgebra relacional?", "o": ["Se eliminan automáticamente las tuplas duplicadas, ya que el resultado de toda operación algebraica es un conjunto matemático.", "Se conservan todas las tuplas idénticas generadas, debido a que el álgebra relacional opera como un multiconjunto (bag).", "Se produce un error de compilación por violación de la restricción de unicidad de la clave primaria subyacente.", "Se sustituyen las tuplas redundantes por valores nulos en el catálogo del sistema gestor de base de datos."], "a": 0, "e": "Dado que una relación matemática se define estrictamente como un conjunto y no como un multiconjunto, no se admiten elementos repetidos. Al aplicar una Proyección (π _atributos(R)), si la omisión de ciertas columnas genera filas idénticas, el operador algebraico formal elimina los duplicados de forma obligatoria. La opción b describe el comportamiento de SQL con SELECT simple (que opera por defecto como multiconjunto requiriendo DISTINCT), pero contradice la teoría matemática del álgebra relacional. Las opciones c y d afirman errores sintácticos o inserciones de nulos inexistentes."}, {"s": "Para que sea matemáticamente válido aplicar los operadores algebraicos de Unión (∪), Intersección (∩) o Diferencia (-) entre dos relaciones R y S, ¿qué condición formal deben satisfacer?", "o": ["Ambas relaciones deben compartir obligatoriamente el mismo nombre de tabla y la misma cantidad de índices físicos.", "Deben ser compatibles respecto de la unión, teniendo el mismo grado y dominios compatibles correspondientes uno a uno.", "Deben estar vinculadas previamente mediante una relación de clave externa definida con la regla de borrado en cascada.", "La cardinalidad de la relación R debe ser exactamente igual a la cardinalidad de la relación S."], "a": 1, "e": "Dos relaciones son compatibles respecto de la unión (Union-Compatible) si y solo si poseen el mismo grado (misma cantidad de atributos) y los dominios de los atributos correspondientes emparejados por posición son idénticos o compatibles entre sí. La opción a exige nombres de tablas iguales (lo cual impediría unir relaciones distintas). La opción c introduce restricciones de claves foráneas irrelevantes para las operaciones de conjuntos. La opción d exige erróneamente igual cantidad de tuplas, lo cual no es un requisito algebraico."}, {"s": "Dadas dos relaciones compatibles R y S, ¿cuál de las siguientes propiedades describe con exactitud a la operación de Diferencia de Conjuntos (R-S)?", "o": ["Es una operación asociativa y conmutativa, cumpliéndose formalmente que R-S produce el mismo resultado que S-R.", "Multiplica la cardinalidad de R por la cardinalidad de S y suma los grados de ambos esquemas en la relación resultante.", "Retorna las tuplas que pertenecen a la relación R pero que no están presentes en la relación S, no siendo conmutativa.", "Identifica exclusivamente las tuplas que contienen valores nulos en los atributos no coincidentes de ambas tablas."], "a": 2, "e": "La Diferencia de Conjuntos R-S retorna el conjunto de todas las tuplas que están en R y que no aparecen en S. A diferencia de la unión o la intersección, la diferencia es asimétrica y no conmutativa, por lo que en general R-Sne S-R. La opción a afirma falsamente que es una operación conmutativa. La opción b confunde la diferencia con el producto cartesiano. La opción d atribuye a la diferencia la detección de valores nulos."}, {"s": "Si una relación R tiene un grado de 4 atributos y una cardinalidad de 50 tuplas, y una relación S tiene un grado de 3 atributos y una cardinalidad de 20 tuplas, ¿cuáles serán las dimensiones del esquema resultante de la operación R× S?", "o": ["Grado igual a 12 y cardinalidad igual a 70 tuplas.", "Grado igual a 1 y cardinalidad igual a 1.000 tuplas.", "Grado igual a 7 y cardinalidad igual a 70 tuplas.", "Grado igual a 7 y cardinalidad igual a 1.000 tuplas."], "a": 3, "e": "En el producto cartesiano R× S, cada tupla de R se concatena con cada tupla de S. Por lo tanto: el grado resultante es la suma de los grados (4+3=7 atributos) y la cardinalidad resultante es el producto de las cardinalidades (50× 20=1.000 tuplas). La opción a multiplica los grados y suma las cardinalidades. La opción b reduce los grados a uno. La opción c suma las cardinalidades en lugar de multiplicarlas."}, {"s": "Al transformar una relación binaria de cardinalidad N:M entre las entidades PROVEEDOR y PRODUCTO al esquema relacional, ¿cuál es la regla de transformación formal obligatoria?", "o": ["Crear una nueva relación intermedia cuya clave primaria esté compuesta por las claves primarias de ambas entidades asociadas.", "Propagar la clave primaria de PRODUCTO como clave externa en la tabla PROVEEDOR admitiendo valores nulos.", "Fusionar ambas entidades en una tabla única desnormalizada asignando un identificador sustituto auto-incremental.", "Crear una vista virtual en el catálogo del sistema que reemplace a las tablas físicas para evitar redundancias de almacenamiento."], "a": 0, "e": "Las relaciones N:M no pueden resolverse mediante la propagación de claves simples sin violar la primera forma normal o generar redundancias incontroladas. La regla algorítmica de mapeo exige crear una relación intermedia cuyos atributos contengan las claves primarias de ambas entidades; la combinación de ambas claves constituye la clave primaria compuesta de la nueva relación. La opción b forzaría a que un producto pertenezca a un único proveedor, reduciendo la multiplicidad a 1:N. La opción c generaría anomalías graves de redundancia y actualización. La opción d confunde tablas físicas persistentes con vistas virtuales."}, {"s": "Se tiene una relación 1:1 entre EMPLEADO y VEHICULO_EMPRESA, donde no todos los empleados tienen vehículo (participación parcial), pero todo vehículo está asignado obligatoriamente a un empleado (participación total). ¿Cuál es la estrategia de diseño relacional más adecuada para evitar valores nulos masivos?", "o": ["Propagar la clave de VEHICULO_EMPRESA dentro de la tabla EMPLEADO como clave foránea opcional.", "Propagar la clave de EMPLEADO como clave foránea no nula dentro de la tabla VEHICULO_EMPRESA.", "Crear obligatoriamente una tabla intermedia asociativa con claves alternativas compuestas para evitar índices nulos.", "Descartar la entidad VEHICULO_EMPRESA e incorporar sus atributos como campos derivados en la tabla EMPLEADO."], "a": 1, "e": "En relaciones 1:1 con participación parcial de un lado y total del otro, la clave primaria de la entidad con participación parcial (EMPLEADO) debe propagarse hacia la tabla que tiene participación total (VEHICULO_EMPRESA). Como todo vehículo debe tener obligatoriamente un empleado asignado, esa clave externa se define como NOT NULL, garantizando cero valores nulos en el esquema. La opción a propagaría la clave hacia EMPLEADO, llenando la tabla de valores nulos para todos los empleados que no tienen vehículo asignado. La opción c propone una tabla intermedia innecesaria para una relación 1:1. La opción d fusiona de forma arbitraria dos entidades conceptualmente independientes."}, {"s": "En la definición de esquemas de bases de datos relacionales mediante lenguaje DDL, ¿cuál es el alcance y propósito de una Restricción de Integridad General (definida típicamente con la cláusula CHECK)?", "o": ["Garantizar que cada tabla física cuente con un índice agrupado único antes de ejecutar consultas analíticas.", "Forzar a que los nombres de los atributos sigan estrictamente las convenciones léxicas del estándar ANSI SQL.", "Exigir el cumplimiento de reglas semánticas y predicados de negocio sobre una o más columnas al momento de insertar o modificar tuplas.", "Reemplazar a las restricciones de clave foránea cuando las tablas pertenecen a esquemas conceptuales distintos."], "a": 2, "e": "Las restricciones de integridad general o reglas de negocio personalizadas se implementan mediante restricciones CHECK en el DDL. Establecen condiciones lógicas o rangos de valores válidos (por ejemplo, precio > 0 o edad >= 18) que el motor comprueba antes de autorizar cualquier operación de inserción o actualización de datos. La opción a alude a la creación física de índices en el motor. La opción b se refiere a convenciones de nombrado del diseñador. La opción d confunde restricciones de predicado de atributo con relaciones de integridad referencial entre tablas."}]}, {"n": 4, "title": "Normalización y Calidad del Diseño Relacional", "qs": [{"s": "¿Cuál es la finalidad teórica y metodológica primordial del proceso de normalización en el diseño de bases de datos relacionales?", "o": ["Transformar sentencias DML imperativas a expresiones de cálculo relacional para acelerar la creación de vistas materializadas.", "Descomponer esquemas relacionales complejos mediante dependencias funcionales para minimizar la redundancia y prevenir anomalías.", "Reducir la cantidad de claves foráneas de la base de datos fusionando todas las entidades dependientes en una única tabla global.", "Garantizar que todas las columnas de una relación posean índices agrupados únicos antes de iniciar la carga masiva de transacciones."], "a": 1, "e": "La normalización es una técnica formal de diseño lógico basada en dependencias funcionales que busca descomponer relaciones complejas en relaciones más pequeñas y estructuradas, eliminando la duplicación innecesaria de datos (redundancia) y suprimiendo las anomalías de inserción, actualización y borrado. La opción a confunde normalización con lenguajes de consulta teóricos y vistas. La opción c propone la consolidación en una \"tabla universal\", lo cual agrava la redundancia y genera anomalías severas. La opción d alude a tareas de indexación del diseño físico, ajenas a la teoría de formas normales."}, {"s": "En un esquema mal diseñado donde se almacenan datos de EMPLEADO y DEPARTAMENTO en una única tabla cuya clave primaria es id_empleado, ¿en qué consiste la anomalía de inserción?", "o": ["En la duplicación obligatoria de los datos personales del empleado cada vez que se modifica el nombre de su departamento.", "En la imposibilidad de dar de alta un nuevo departamento en la base de datos hasta que no se le asigne al menos un empleado.", "En el bloqueo automático de las transacciones concurrentes debido a la existencia de claves foráneas con verificación diferida.", "En la pérdida involuntaria de los registros históricos del departamento cuando se da de baja al supervisor de la sucursal."], "a": 1, "e": "Una anomalía de inserción se produce cuando una estructura deficiente impone la existencia de un dato para poder registrar otro que es independiente. Si los departamentos dependen de la clave del empleado, no se puede dar de alta un departamento nuevo sin asignarle previamente un empleado, so pena de violar la integridad de entidad (clave primaria nula). La opción a describe la anomalía de actualización. La opción c confunde anomalías de diseño lógico con problemas de concurrencia transaccional en el motor. La opción d describe la anomalía de borrado."}, {"s": "En una tabla desnormalizada de CURSO_ALUMNO, si un estudiante es el único matriculado en un curso determinado y decide cancelar su inscripción provocando la eliminación de dicha tupla, se pierden todos los datos del curso (nombre, aula, docente). ¿Qué tipo de anomalía describe exactamente esta situación?", "o": ["Anomalía de modificación por dependencia trivial cíclica.", "Anomalía de inserción por violación de clave candidata secundaria.", "Anomalía de borrado originada por la mezcla de entidades independientes en un mismo esquema.", "Anomalía de consistencia concurrente por falta de bloqueos pesados a nivel de página."], "a": 2, "e": "La anomalía de borrado ocurre cuando la eliminación legítima de una entidad (un alumno que cancela su cursada) arrastra de forma no deseada e irreversible la pérdida de la única información registrada sobre otra entidad independiente (el curso y sus características) debido a que ambas compartían indebidamente la misma tabla. Las opciones a y b introducen términos incorrectos para este fenómeno. La opción d confunde fallas estructurales del esquema con mecanismos de bloqueo (locks) del motor relacional."}, {"s": "Dadas dos tuplas t₁ y t₂ de una relación R, ¿cuál es la definición formal de la dependencia funcional X→ Y?", "o": ["Si t₁[X]=t₂[X], entonces obligatoriamente debe cumplirse que t₁[Y]=t₂[Y].", "El conjunto de atributos Y debe ser forzosamente un subconjunto estricto del conjunto de atributos X.", "La cantidad de tuplas distintas en el atributo X debe ser exactamente igual a la cardinalidad total de la tabla.", "Si el valor de X es nulo, el valor del atributo dependiente Y debe evaluarse como verdadero en lógica trivaluada."], "a": 0, "e": "Formalmente, una dependencia funcional X→ Y sobre una relación R establece que para cualquier par de tuplas t₁,t₂∈ R, si coinciden en los valores de los atributos del determinante X (t₁[X]=t₂[X]), obligatoriamente deben coincidir en los valores del conjunto dependiente Y (t₁[Y]=t₂[Y]). La opción b define a una dependencia trivial (Y⊆ X), que es solo un caso particular. La opción c confunde dependencias funcionales con la cardinalidad total de la relación. La opción d describe evaluaciones de valores nulos en el motor, lo cual no forma parte de la definición formal de dependencia funcional."}, {"s": "En la expresión formal de una dependencia funcional X→ Y, ¿qué papel asume el conjunto de atributos X?", "o": ["Actúa como el conjunto dependiente cuyos valores están subordinados al dominio de Y.", "Actúa como el determinante, teniendo la capacidad de determinar unívocamente el valor de los atributos de Y.", "Representa necesariamente una clave externa referenciada a una tabla de auditoría del sistema gestor.", "Define el discriminador parcial que convierte a la relación en una entidad débil relacional."], "a": 1, "e": "En la notación X→ Y, el lado izquierdo X recibe formalmente el nombre de determinante, ya que su valor determina de forma única e inequívoca el valor asociado del lado derecho Y (el dependiente). La opción a invierte los roles llamando dependiente al lado izquierdo. Las opciones c y d atribuyen al determinante funciones de auditoría o de entidades débiles que no corresponden a su definición en la teoría de normalización."}, {"s": "Una relación se encuentra formalmente en Primera Forma Normal (1FN) si y sólo si cumple con cuál de las siguientes condiciones:", "o": ["Ningún atributo no clave depende de otro atributo no clave mediante dependencias transitivas.", "Todos los atributos que no forman parte de la clave primaria dependen funcionalmente de la clave de forma completa.", "Todos los atributos son atómicos, cada celda contiene un único valor y no existen grupos repetitivos.", "Todo determinante de cualquier dependencia funcional no trivial es obligatoriamente una superclave."], "a": 2, "e": "Una relación está en 1FN si y solo si todos los atributos contienen exclusivamente valores atómicos (indivisibles), cada intersección fila-columna contiene un único valor escalar y la relación carece de grupos repetitivos. La opción a corresponde a la condición de 3FN. La opción b define la condición de 2FN. La opción d corresponde a la definición de la Forma Normal de Boyce-Codd (FNBC)."}, {"s": "En una relación con clave primaria compuesta A,B, ¿cuándo se afirma formalmente que un atributo no clave C presenta una dependencia funcional parcial?", "o": ["Cuando el atributo C depende funcionalmente de la combinación estricta A,B y de ninguna de sus partes.", "Cuando el atributo C depende funcionalmente de un subconjunto propio de la clave primaria (solo de A o solo de B).", "Cuando el atributo C determina a un tercer atributo D que no forma parte de la clave candidata.", "Cuando el atributo C admite valores nulos en el cincuenta por ciento de las tuplas físicas de la tabla."], "a": 1, "e": "Una dependencia parcial se manifiesta cuando un atributo no clave no necesita de toda la clave primaria compuesta para ser determinado, sino que depende funcionalmente de una parte o subconjunto propio de dicha clave. La opción a define la dependencia funcional completa (requerida por la 2FN). La opción c describe una dependencia transitiva. La opción d alude a la densidad de valores nulos, ajena a la definición de dependencia parcial."}, {"s": "¿Cuál es la condición sine qua non para que una relación esté en Segunda Forma Normal (2FN)?", "o": ["Estar en 1FN y que ningún atributo no clave dependa funcionalmente de forma parcial de la clave primaria.", "Estar en 1FN y carecer de atributos multivaluados representados mediante claves foráneas compuestas.", "Estar en 3FN y asegurar que el esquema preserve todas las dependencias funcionales tras la descomposición.", "Estar en 1FN y poseer una clave primaria simple constituida por un único atributo auto-incremental."], "a": 0, "e": "La 2FN exige como requisitos: (1) que la relación esté previamente en 1FN, y (2) que todos los atributos que no formen parte de la clave primaria dependan funcionalmente de la clave primaria completa, eliminando cualquier dependencia parcial. La opción b describe la resolución de 1FN. La opción c invierte la jerarquía de formas normales (2FN precede a 3FN). La opción d afirma falsamente que la clave debe ser simple; si bien una clave simple asegura 2FN, no es la definición de la norma."}, {"s": "Si una relación relacional se encuentra en 1FN y su clave primaria es simple (formada por un único atributo), ¿qué se deduce teóricamente respecto a la 2FN?", "o": ["Debe descomponerse obligatoriamente en dos relaciones binarias para alcanzar la 2FN sin pérdida.", "Viola la 2FN de forma inmediata al no poseer atributos suficientes para verificar dependencias completas.", "Se encuentra automáticamente en 2FN, ya que es matemáticamente imposible que existan dependencias parciales.", "Solo alcanzará la 2FN si todos los atributos no clave son declarados explícitamente con restricciones NOT NULL."], "a": 2, "e": "Por definición matemática, una dependencia parcial requiere que el determinante de la dependencia sea un subconjunto propio de la clave primaria. Si la clave primaria consta de un único atributo, no posee subconjuntos propios no vacíos; por ende, toda relación en 1FN con clave simple se encuentra automáticamente en 2FN. Las opciones a y b afirman que se viola la 2FN o que requiere descomposición, lo cual es teóricamente falso. La opción d introduce restricciones de nulidad que no guardan relación con la transitividad o parcialidad de las dependencias."}, {"s": "Si en una relación con clave primaria A se determinan las dependencias funcionales A→ B y B→ C, donde B no es superclave ni clave candidata, ¿cómo se califica la relación de dependencia entre A y C?", "o": ["Dependencia multivaluada trivial con pérdida de información.", "Dependencia funcional parcial originada por clave primaria compuesta.", "Dependencia de inclusión cíclica evaluada por el compilador DDL.", "Dependencia funcional transitiva, donde C depende de A a través del atributo no clave B."], "a": 3, "e": "Una dependencia transitiva ocurre cuando un atributo no clave depende funcionalmente de otro atributo no clave, el cual a su vez depende de la clave primaria (es decir: Clave→ X y X→ Y, donde X no es clave). El atributo Y depende de la clave a través de X de manera indirecta o transitiva. La opción a se refiere a dependencias multivaluadas (4FN). La opción b confunde el fenómeno con dependencias parciales sobre partes de una clave compuesta. La opción c utiliza términos inexistentes en la teoría de normalización."}, {"s": "Una relación se encuentra en Tercera Forma Normal (3FN) si y sólo si:", "o": ["Está en 2FN y ningún atributo no clave depende transitivamente de la clave primaria (los no clave dependen solo de la clave).", "Está en 1FN y todos los determinantes de las dependencias funcionales son claves foráneas obligatorias.", "Está en 2FN y se ha aplicado desnormalización física controlada para eliminar el uso de consultas con JOIN.", "Todos sus atributos pertenecen a claves candidatas disjuntas sin dependencias funcionales completas."], "a": 0, "e": "Para que una relación alcance la 3FN debe cumplir dos condiciones formales: estar en 2FN y que ningún atributo que no forme parte de la clave primaria dependa transitivamente de ella (todos los atributos no clave deben depender directa y exclusivamente de la clave primaria). La opción b confunde determinantes con claves externas del diseño relacional. La opción c asocia falsamente la 3FN con desnormalización física (que es el proceso inverso). La opción d confunde la regla con condiciones de claves primarias disjuntas."}, {"s": "¿En qué circunstancia fundamental un esquema relacional que ya cumple con la 3FN puede violar la Forma Normal de Boyce-Codd (FNBC)?", "o": ["Cuando la clave primaria está formada por un único atributo numérico entero sin restricciones de dominio.", "Cuando existe una dependencia funcional X→ Y donde X no es superclave, pero Y es un atributo primo (parte de una clave candidata).", "Cuando la tabla contiene atributos derivados que no han sido materializados en el catálogo del sistema gestor.", "Cuando la descomposición genera tuplas espurias al realizar la combinación natural de las tablas resultantes."], "a": 1, "e": "La 3FN permite que en una dependencia X→ Y, si X no es superclave, la relación continúe en 3FN siempre que Y sea un atributo primo (parte de alguna clave candidata). La FNBC elimina esta excepción: exige de forma estricta que para toda dependencia funcional no trivial X→ Y, el determinante X sea obligatoriamente una superclave. La opción a describe un caso donde no hay anomalías de FNBC. La opción c alude a atributos derivados del modelo conceptual. La opción d confunde la condición de FNBC con la propiedad de reunión sin pérdida en la descomposición."}, {"s": "¿Qué significa formalmente que una descomposición de una relación R en R₁,R₂ sea con unión sin pérdida de información?", "o": ["Que el espacio en disco ocupado por R₁ y R₂ es exactamente igual al tamaño en bytes de la relación R.", "Que la unión natural de R₁ y R₂ recupera exactamente las tuplas de R original, sin generar tuplas espurias ni perder datos.", "Que todas las dependencias funcionales originales pueden comprobarse examinando cada tabla por separado sin hacer JOIN.", "Que las claves foráneas de ambas relaciones resultantes permiten valores nulos sin activar el borrado en cascada."], "a": 1, "e": "Una descomposición se considera con unión sin pérdida (lossless-join) si y sólo si al efectuar la combinación natural (R₁ ⋈ R₂) se reconstruye con exactitud matemática el conjunto original de tuplas de R, sin perder registros legítimos y sin introducir tuplas espurias (filas falsas inexistentes en el mundo real). La opción a alude al tamaño de almacenamiento en disco en bytes, lo cual no define la integridad lógica de la reunión. La opción c define la propiedad de preservación de dependencias, que es ortogonal e independiente de la reunión sin pérdida. La opción d se refiere al comportamiento de integridad referencial."}, {"s": "Respecto al balance entre formas normales avanzadas y preservación de restricciones, ¿cuál de las siguientes afirmaciones es correcta?", "o": ["La normalización a FNBC garantiza en el cien por ciento de los casos la preservación de todas las dependencias funcionales originales.", "La 3FN permite siempre alcanzar una descomposición con unión sin pérdida y preservación de dependencias, mientras que FNBC puede no preservarlas.", "La pérdida de dependencias funcionales en 2FN es una condición obligatoria para eliminar los atributos multivaluados.", "La preservación de dependencias solo es exigible cuando la relación resultante se implementa en sistemas gestores NoSQL."], "a": 1, "e": "Siempre es posible descomponer cualquier relación universal en un conjunto de relaciones en 3FN que satisfagan simultáneamente la unión sin pérdida y la preservación de dependencias. En cambio, para la FNBC se garantiza la unión sin pérdida, pero no siempre es posible preservar todas las dependencias funcionales originales en las tablas resultantes. La opción a es falsa; la FNBC no siempre puede preservar dependencias (es una pregunta clásica de examen). La opción c asocia falsamente la pérdida de dependencias con la 1FN o 2FN. La opción d es incorrecta ya que las dependencias funcionales son un pilar central de los sistemas relacionales."}, {"s": "¿Cómo se define formalmente la desnormalización y en qué contexto del ciclo de vida de la base de datos es técnicamente justificada?", "o": ["Es un error de modelado conceptual derivado de un análisis incorrecto de las reglas del negocio en el diagrama de Chen.", "Es una técnica del diseño físico consistente en introducir redundancia controlada para optimizar el rendimiento de lectura en consultas pesadas.", "Es el proceso algorítmico utilizado para convertir una base de datos documental en un esquema relacional puro en 1FN.", "Es la supresión de restricciones CHECK y de claves primarias para acelerar transacciones masivas en entornos OLTP."], "a": 1, "e": "La desnormalización es un proceso deliberado y controlado, aplicado típicamente durante la fase de diseño físico sobre esquemas normalizados, donde se introduce redundancia calculada para reducir el costo computacional de múltiples JOIN y acelerar las consultas de lectura en sistemas analíticos o de alto tráfico. La opción a califica falsamente a la desnormalización como un error, cuando es una estrategia técnica consciente. La opción c confunde la técnica con transformaciones NoSQL. La opción d propone la eliminación destructiva de restricciones de integridad esenciales."}]}, {"n": 5, "title": "Fundamentos de SQL, OLP, NULL, Restricciones y Procesamiento de Consultas", "qs": [{"s": "En la arquitectura de un SGBD relacional, ¿cuál es la relación fundamental entre la naturaleza declarativa de SQL y el rol del optimizador de consultas?", "o": ["El usuario programa explícitamente los recorridos en disco mediante bucles procedimentales que el optimizador solo compila a código binario.", "El usuario describe qué conjunto de resultados desea obtener, delegando en el optimizador la determinación de la ruta y plan físico de ejecución más eficiente.", "El usuario define las estructuras de los índices B+ en cada consulta para que el optimizador suprima la fase de traducción al álgebra relacional.", "El usuario declara las variables de asignación de memoria dinámica que el optimizador utiliza para evitar el uso del registro de transacciones."], "a": 1, "e": "SQL es un lenguaje declarativo de alto nivel: el usuario especifica qué datos desea recuperar sin indicar los procedimientos de acceso físico. El procesador y optimizador de consultas del SGBD analiza la consulta, la traduce a una expresión del álgebra relacional y genera múltiples planes de ejecución físicos, seleccionando el más económico y eficiente en función de las estadísticas de distribución y los índices existentes. La opción a describe un lenguaje imperativo o procedimental de bajo nivel. La opción c es falsa porque la traducción al álgebra relacional es obligatoria en la optimización lógica. La opción d confunde sentencias de consulta con gestión de memoria y recuperación transaccional."}, {"s": "En el Orden Lógico de Procesamiento (OLP) de una consulta SELECT, ¿por qué está terminantemente prohibido utilizar alias de columnas calculadas dentro de la cláusula WHERE?", "o": ["Porque la cláusula WHERE (Paso 4) opera lógicamente antes de la proyección en SELECT (Paso 8), momento en el cual recién se definen los alias.", "Porque los alias de columnas solo son visibles en expresiones analíticas procesadas dentro de la cláusula HAVING.", "Porque el estándar ANSI SQL exige que la cláusula WHERE evalúe exclusivamente predicados basados en claves primarias simples.", "Porque el optimizador de consultas colapsa las columnas calculadas en tablas temporales que se destruyen al finalizar el paso FROM."], "a": 0, "e": "De acuerdo con el Orden Lógico de Procesamiento (OLP), el motor procesa las cláusulas en la secuencia: FROM (1), ON (2), JOIN (3), WHERE (4), GROUP BY (5), HAVING (7), SELECT (8) y ORDER BY (10). Como WHERE se ejecuta en el Paso 4, opera sobre la tabla virtual generada por las tablas base; los alias de columna creados en la proyección SELECT (Paso 8) aún no existen lógicamente en ese momento y están fuera de alcance (scope). La opción b alude a HAVING, donde tampoco son visibles los alias de columna por ejecutarse antes del SELECT. La opción c limita falsamente a WHERE sobre claves primarias. La opción d inventa un comportamiento destructivo de tablas temporales inexistente en el motor."}, {"s": "Un desarrollador intenta ejecutar la siguiente instrucción: SELECT depto_id, AVG(salario) FROM empleado WHERE AVG(salario) &gt; 50000 GROUP BY depto_id; ¿Cuál es la causa técnica exacta por la que esta consulta es rechazada en la compilación lógica?", "o": ["Las funciones de agregación requieren obligatoriamente que la tabla posea un índice agrupado sobre la columna evaluada.", "La cláusula WHERE evalúa filas individuales antes de que se creen los grupos, por lo que no puede contener funciones de agregado.", "La cláusula GROUP BY no puede combinarse con funciones de promedio cuando existen valores nulos en el conjunto de tuplas.", "El tipo de dato devuelto por AVG es incompatible con los operadores relacionales de comparación escalar en SQL estándar."], "a": 1, "e": "La cláusula WHERE (Paso 4 del OLP) es un filtro de predicado de tupla individual que actúa antes de que ocurra la fase de agrupamiento (GROUP BY, Paso 5). Por ende, es una violación semántica incluir funciones agregadas (SUM, AVG, COUNT) en el WHERE, ya que estas requieren que los grupos ya hayan sido consolidados; cualquier condición sobre valores agregados debe residir obligatoriamente en la cláusula HAVING (Paso 7). La opción a confunde agregaciones con requisitos de índices físicos. La opción c es falsa porque GROUP BY y las agregaciones admiten nulos de forma nativa. La opción d afirm

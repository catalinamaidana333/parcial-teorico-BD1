a erróneamente una incompatibilidad de tipos escalares."}, {"s": "En la optimización lógica previa a la generación del plan de ejecución físico, ¿en qué consiste la regla de equivalencia denominada \"Empuje de Selección\" (Pushing Selection Down)?", "o": ["En posponer el filtrado de tuplas hasta después de haber completado la ordenación final en la cláusula ORDER BY.", "En sustituir los operadores de comparación simples por subconsultas correlacionadas para forzar el uso de memoria RAM.", "En trasladar las condiciones de filtrado lo más cerca posible de las tablas base, reduciendo tempranamente el volumen de datos a combinar.", "En forzar al motor a aplicar las restricciones CHECK antes de verificar la compatibilidad de tipos en la cláusula FROM."], "a": 2, "e": "La regla de equivalencia relacional de \"Empuje de Selección\" (Pushing Selection Down) establece que las operaciones de selección (filtros) deben aplicarse lo antes posible sobre las relaciones base. Al filtrar las tuplas tempranamente, se reduce drásticamente la cantidad de datos que ingresan a operaciones computacionalmente costosas como combinaciones (JOIN), agrupamientos (GROUP BY) o productos cartesianos, optimizando el consumo de E/S y memoria. La opción a propone lo opuesto a la optimización (posponer filtros satura el motor). La opción b propone subconsultas correlacionadas, que suelen ser más costosas de evaluar. La opción d confunde la optimización lógica de consultas con la validación de restricciones DDL."}, {"s": "En una consulta que combina las tablas CLIENTE y PEDIDO mediante INNER JOIN, ¿cuál es el criterio formal que determina qué filas formarán parte del resultado final?", "o": ["Se incluyen todas las tuplas de la tabla izquierda, rellenando con valores nulos aquellas que no posean registros asociados en la derecha.", "Se incluyen únicamente aquellas tuplas que satisfacen simultáneamente el predicado de emparejamiento definido en la cláusula ON.", "Se genera el producto cartesiano absoluto de ambas tablas, preservando las filas duplicadas mediante operaciones de bolsa.", "Se descartan las tuplas de ambas tablas que presenten cualquier valor nulo en atributos que no formen parte de la condición de unión."], "a": 1, "e": "Un INNER JOIN (o combinación interna) representa la conjunción estricta de dos tablas basada en un predicado de coincidencia. El conjunto resultante contiene únicamente aquellas tuplas donde la condición lógica de la cláusula ON evalúa a verdadero (TRUE), descartando cualquier registro de una tabla que no encuentre correspondencia en la otra. La opción a describe el comportamiento de un LEFT OUTER JOIN. La opción c describe un producto cartesiano (CROSS JOIN). La opción d es falsa porque las columnas que no intervienen en el predicado de unión pueden contener nulos sin alterar el emparejamiento."}, {"s": "Al ejecutar un LEFT JOIN entre DEPARTAMENTO (tabla izquierda) y EMPLEADO (tabla derecha), ¿qué sucede con los departamentos que no tienen ningún empleado asignado?", "o": ["Se preservan en el resultado final, completando todos los atributos correspondientes a la tabla EMPLEADO con valores NULL.", "Se descartan automáticamente de la salida, ya que la condición de unión evalúa a falso en el Álgebra Relacional.", "Producen un error de ejecución en el motor por violación de la restricción de integridad referencial declarada.", "Se sustituyen por el primer registro no nulo de la tabla EMPLEADO para garantizar la cardinalidad del conjunto."], "a": 0, "e": "El LEFT OUTER JOIN preserva todas las tuplas de la tabla especificada a la izquierda del operador, independientemente de si encuentran o no coincidencia en la tabla de la derecha. Para aquellos registros de la izquierda sin correspondencia en la derecha, el motor extiende la fila asignando valores NULL a todos los atributos correspondientes a la tabla derecha. La opción b describe el comportamiento de un INNER JOIN. La opción c afirma falsamente que se violan restricciones de integridad (el LEFT JOIN es una operación de consulta DML que no altera ni viola restricciones). La opción d inventa un mecanismo de sustitución arbitrario inexistente en SQL estándar."}, {"s": "¿Qué resultado semántico produce la ejecución de un FULL OUTER JOIN entre dos relaciones R y S?", "o": ["Produce exclusivamente las tuplas que no coinciden en ninguna de las dos relaciones, descartando las coincidencias exactas.", "Equivale a un producto cartesiano puro sin evaluación de predicados lógicos entre los esquemas participantes.", "Devuelve las tuplas que coinciden en ambas tablas más las tuplas no coincidentes de R y de S, rellenando con NULL donde no hay par.", "Exige obligatoriamente que ambas relaciones sean compatibles respecto de la unión, teniendo el mismo grado y dominios idénticos."], "a": 2, "e": "El FULL OUTER JOIN combina la semántica de un LEFT JOIN y un RIGHT JOIN: conserva todas las filas donde existe coincidencia entre ambas tablas, más todas las filas no coincidentes de la tabla izquierda (rellenando con NULL las columnas de la derecha), más todas las filas no coincidentes de la tabla derecha (rellenando con NULL las columnas de la izquierda). La opción a describe uniones externas exclusivas con filtros posteriores WHERE ... IS NULL. La opción b alude al CROSS JOIN. La opción d confunde FULL OUTER JOIN con el operador de conjuntos UNION (que sí requiere compatibilidad de unión)."}, {"s": "En SQL, si una columna bonificacion contiene un valor NULL, ¿cuál es el resultado lógico de evaluar la expresión bonificacion = 500 y qué efecto tiene en el WHERE?", "o": ["Evalúa a FALSE, provocando que la fila sea descartada por el filtro condicional de la consulta.", "Evalúa a TRUE, permitiendo que la fila ingrese al conjunto de resultados bajo el supuesto de valor no asignado.", "Evalúa a UNKNOWN, y al no ser verdadero (TRUE), la fila es descartada del resultado por la cláusula WHERE.", "Provoca una excepción en tiempo de ejecución debido a la incompatibilidad entre valores nulos y literales numéricos."], "a": 2, "e": "SQL implementa lógica trivaluada con tres valores de verdad: TRUE, FALSE y UNKNOWN. Dado que NULL representa un valor desconocido o no informado, cualquier comparación contra él (como = 500) arroja como resultado UNKNOWN. En la cláusula WHERE, el motor aplica el principio de aceptación estricta: solo se conservan las filas donde el predicado evalúa a TRUE; por ende, las condiciones que resultan en UNKNOWN son descartadas. Las opciones a y b asumen incorrectamente lógica bivalente clásica (donde todo es verdadero o falso). La opción d es incorrecta ya que la comparación contra un nulo es sintácticamente válida y no genera excepciones de tipo, sino el estado lógico UNKNOWN."}, {"s": "Si se ejecuta la consulta SELECT AVG(comision) FROM vendedor; sobre una tabla donde 4 vendedores tienen comisión de 100 y 2 vendedores tienen comisión con valor NULL, ¿cómo procesa el cálculo SQL Server?", "o": ["Divide la suma total (400) por 6 tuplas físicas, asumiendo implícitamente que los nulos equivalen al valor cero.", "Ignora los valores nulos tanto en la suma acumulada como en el conteo del denominador, dividiendo 400 por 4 vendedores.", "Retorna un valor NULL general como resultado de la consulta al no poder determinar el promedio exacto de la población.", "Emite un error de compilación exigiendo envolver previamente la columna con la función escalar ISNULL() o COALESCE()."], "a": 1, "e": "De acuerdo con el estándar SQL, las funciones de agregación (SUM, AVG, MIN, MAX, COUNT(columna)) eliminan e ignoran sistemáticamente todos los valores NULL antes de procesar el cálculo. Para la función AVG, el motor suma únicamente los valores numéricos conocidos y divide esa suma exclusivamente entre la cantidad de registros que poseen valores no nulos (en este caso, 400 dividido 4 = 100). La opción a describe una creencia errónea común: AVG jamás cuenta los nulos en el divisor a menos que se fuerce su reemplazo con ISNULL(columna, 0). La opción c es falsa ya que solo devuelve NULL si el conjunto completo está vacío o compuesto únicamente por nulos. La opción d afirma falsamente que se genera un error de compilación."}, {"s": "Si una subconsulta utilizada dentro de una condición WHERE id NOT IN (SELECT supervisor_id FROM ...) devuelve los valores {1, 2, NULL}, ¿cuál es el resultado de la consulta externa?", "o": ["Devuelve únicamente las tuplas cuyo identificador sea distinto de 1 y de 2, ignorando la presencia del valor nulo.", "Devuelve todas las tuplas de la tabla externa debido a que la presencia del valor nulo anula la evaluación de los enteros.", "Devuelve un conjunto vacío (cero filas), ya que la comparación relacional con NULL produce UNKNOWN en toda la conjunción lógica.", "Reemplaza automáticamente el valor nulo por cero y retorna las filas que no coincidan con ninguno de los tres elementos."], "a": 2, "e": "El predicado id NOT IN (1, 2, NULL) se traduce internamente en una conjunción lógica de desigualdades: id &lt;&gt; 1 AND id &lt;&gt; 2 AND id &lt;&gt; NULL. Como cualquier comparación escalar contra NULL resulta en UNKNOWN, la expresión se convierte en: (condición) AND UNKNOWN. En la tabla de verdad del operador AND, si al menos un operando es UNKNOWN y ninguno es FALSE, el resultado global es UNKNOWN. Como la cláusula WHERE solo selecciona tuplas verdaderas (TRUE), la consulta descarta todas las filas y retorna un conjunto vacío (0 tuplas). La opción a describe el comportamiento que tendría el operador NOT EXISTS o un NOT IN con filtro IS NOT NULL. Las opciones b y d asumen comportamientos de sustitución o anulación inexistentes en la semántica de predicados de SQL."}, {"s": "¿Cuál es la diferencia técnica fundamental entre una restricción PRIMARY KEY y una restricción UNIQUE en una tabla relacional?", "o": ["Una tabla puede tener múltiples restricciones UNIQUE y estas permiten valores nulos (según el motor), mientras que solo existe una PRIMARY KEY y prohíbe nulos.", "La restricción UNIQUE solo se aplica sobre columnas de texto, mientras que PRIMARY KEY opera exclusivamente sobre tipos numéricos enteros.", "La restricción PRIMARY KEY genera siempre un índice no agrupado, mientras que UNIQUE genera obligatoriamente el índice agrupado de la tabla.", "La restricción UNIQUE prohíbe la modificación de los datos con sentencias UPDATE, actuando como una columna de solo lectura."], "a": 0, "e": "La regla de Integridad de Entidad exige que toda tabla relacional base posea una única clave primaria (PRIMARY KEY) y prohíbe de forma absoluta los valores nulos en cualquiera de sus columnas componentes. En contraste, una tabla puede contener múltiples restricciones de unicidad (UNIQUE) para modelar claves alternativas, y estas sí admiten valores nulos (en SQL Server se permite un único valor NULL por restricción UNIQUE estándar, mientras que en otros motores se admiten múltiples nulos). La opción b restringe falsamente las restricciones a ciertos tipos de datos. La opción c invierte o confunde la configuración de índices por defecto (la PK genera por defecto el índice agrupado en SQL Server, pero puede configurarse como no agrupada). La opción d confunde restricciones de unicidad con propiedades de solo lectura o permisos DCL."}, {"s": "En la definición de tablas mediante lenguaje DDL, ¿cuál es el comportamiento de las restricciones DEFAULT y CHECK durante una operación de INSERT?", "o": ["DEFAULT provee un valor automático si la columna se omite en la inserción, y CHECK valida que los datos cumplan una condición booleana no falsa.", "DEFAULT fuerza la conversión de tipos de datos incompatibles, y CHECK comprueba la existencia de la clave foránea en la tabla padre.", "DEFAULT impide la inserción de valores duplicados en memoria, y CHECK audita las transacciones en el registro de transacciones .ldf.", "DEFAULT se ejecuta exclusivamente tras invocar un disparador AFTER, y CHECK solo opera durante la ejecución de sentencias DELETE."], "a": 0, "e": "Una restricción DEFAULT proporciona un valor predefinido para una columna en caso de que la instrucción INSERT no especifique un valor explícito para ella. Por su parte, la restricción CHECK especifica una condición booleana o regla de negocio que cada fila debe satisfacer al momento de insertarse o actualizarse; la operación es autorizada si la condición evalúa a TRUE o UNKNOWN, y rechazada si evalúa a FALSE. La opción b confunde CHECK con la integridad referencial (FOREIGN KEY). La opción c asocia falsamente DEFAULT con unicidad y CHECK con bitácoras transaccionales. La opción d confunde restricciones declarativas estáticas de esquema con disparadores procedurales de auditoría."}, {"s": "¿Qué característica técnica define el comportamiento y procesamiento de una subconsulta no correlacionada?", "o": ["Se ejecuta una única vez de forma independiente de la consulta externa, y su resultado es utilizado posteriormente por esta.", "Debe reevaluarse obligatoriamente fila por fila por cada registro que procesa la consulta externa.", "Requiere que todas las columnas de la consulta interna compartan los mismos alias definidos en la cláusula FROM exterior.", "No puede utilizarse dentro de cláusulas condicionales WHERE ni combinarse con operadores de pertenencia como IN."], "a": 0, "e": "Una subconsulta se denomina no correlacionada (o independiente) cuando no hace referencia a ninguna columna de las tablas presentes en la consulta exterior. Debido a esta independencia semántica, el motor puede resolverla y ejecutarla una única vez al inicio, sustituyendo la subconsulta por su conjunto de resultados constante para ser utilizado por la consulta externa. La opción b describe la dinámica de las subconsultas correlacionadas. La opción c inventa una restricción de nombrado de alias de tabla inexistente. La opción d es falsa puesto que las subconsultas no correlacionadas se utilizan masivamente en cláusulas WHERE con operadores =, &gt;, IN, ALL o ANY."}, {"s": "En una consulta que busca empleados cuyo salario supera el promedio de su propio departamento: SELECT e.nombre, e.salario FROM empleado e WHERE e.salario &gt; (SELECT AVG(sub.salario) FROM empleado sub WHERE sub.depto_id = e.depto_id); ¿Por qué se clasifica a esta subconsulta como correlacionada?", "o": ["Porque utiliza funciones de agregación sobre una tabla derivada definida en la cláusula FROM externa.", "Porque hace referencia a una columna de la consulta externa (e.depto_id), evaluándose una vez por cada fila candidata de e.", "Porque el optimizador de consultas la transforma obligatoriamente en una vista materializada antes de compilar el plan físico.", "Porque contiene una clave foránea reflexiva que impide la eliminación de registros huérfanos durante el filtrado."], "a": 1, "e": "Una subconsulta es correlacionada cuando sus condiciones internas dependen directamente de los valores de las columnas de la fila que está siendo examinada en ese momento por la consulta externa (sub.depto_id = e.depto_id). Debido a este acoplamiento causal, la subconsulta no puede evaluarse de manera aislada antes de la consulta principal: debe ejecutarse repetitivamente una vez por cada fila candidata evaluada por la consulta externa. La opción a describe tablas derivadas comunes en la cláusula FROM. La opción c afirma erróneamente que se materializa siempre como vista (el optimizador suele resolverlas mediante bucles anidados o combinaciones semánticas equivalentes). La opción d confunde relaciones estructurales de claves foráneas con la sintaxis de subconsultas en expresiones de filtrado."}, {"s": "¿Cuál es la propiedad operativa distintiva del operador EXISTS en la evaluación de subconsultas correlacionadas?", "o": ["Compara el valor escalar de la consulta externa contra cada uno de los valores devueltos por la lista de selección interna.", "Exige que la subconsulta interna proyecte obligatoriamente todas las columnas que componen la clave primaria de la tabla hija.", "Evalúa exclusivamente si la subconsulta produce al menos una fila (retornando TRUE), siendo inmune al contenido o a valores nulos proyectados.", "Falla en tiempo de ejecución si la subconsulta interna retorna más de una tupla para una misma fila externa evaluada."], "a": 2, "e": "El operador EXISTS es un predicado booleano de existencia que evalúa si la subconsulta correlacionada devuelve al menos una fila. A diferencia de los operadores escalares o de IN, a EXISTS no le importa qué columnas se proyectan ni qué valores contienen (por eso es convención escribir SELECT 1 o SELECT NULL en su interior); si la subconsulta produce al menos una tupla, retorna TRUE, y si devuelve cero tuplas, retorna FALSE, siendo 100% inmune a la presencia de valores NULL dentro de las filas encontradas. La opción a describe el comportamiento del operador IN o = ANY. La opción b exige falsamente proyectar claves primarias completas (a EXISTS no le interesa la lista de proyección). La opción d confunde EXISTS con las subconsultas escalares (las cuales sí fallan si devuelven más de una fila cuando se usan con operadores de igualdad =)."}]}];
var sel = {};
EJES.forEach(function (e) { sel[e.n] = true; });
var shuffleOn = true;
var list, idx, score, wrong, answered;
var app = document.getElementById('app');
var LET = 'abcd';

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
/* Reasigna las letras citadas en la explicación ("la opción b", "opciones a y d") tras mezclar. */
function remap(text, newOf) {
  return text.replace(/(opci[oó]n(?:es)?\s+)([a-d])((?:\s*(?:,|y|o)\s*)([a-d]))?\b/gi, function (m, pre, l1, rest, l2) {
    var out = pre + LET[newOf[LET.indexOf(l1.toLowerCase())]];
    if (l2) out += rest.slice(0, rest.length - l2.length) + LET[newOf[LET.indexOf(l2.toLowerCase())]];
    return out;
  });
}
function buildList() {
  var out = [];
  EJES.forEach(function (e) {
    if (!sel[e.n]) return;
    e.qs.forEach(function (q) {
      out.push({ eje: e.n, ejeTitle: e.title, s: q.s, o: q.o, a: q.a, e: q.e });
    });
  });
  if (shuffleOn) out = shuffle(out);
  return out.map(function (q) {
    var perm = shuffleOn ? shuffle([0, 1, 2, 3]) : [0, 1, 2, 3];   // perm[nuevo] = viejo
    var newOf = [];
    perm.forEach(function (oldIdx, newIdx) { newOf[oldIdx] = newIdx; });
    return {
      eje: q.eje, ejeTitle: q.ejeTitle, s: q.s,
      o: perm.map(function (k) { return q.o[k]; }),
      a: newOf[q.a],
      e: remap(q.e, newOf)
    };
  });
}

function home(msg) {
  app.innerHTML = '';
  app.appendChild(el('h1', '', 'Simulacro de examen teórico promocional'));
  var c = el('div', 'card');
  c.appendChild(el('p', 'muted', 'Elegí los ejes a practicar y respondé una opción por pregunta.'));
  EJES.forEach(function (e) {
    var l = el('label', 'opt');
    var cb = el('input');
    cb.type = 'checkbox';
    cb.checked = !!sel[e.n];
    cb.onchange = function () { sel[e.n] = cb.checked; if (err) { err.remove(); err = null; } };
    l.appendChild(cb);
    l.appendChild(document.createTextNode(' Eje ' + e.n + ': ' + e.title + ' (' + e.qs.length + ')'));
    c.appendChild(l);
  });
  c.appendChild(el('hr', 'sep'));
  var sl = el('label', 'opt');
  var scb = el('input');
  scb.type = 'checkbox';
  scb.checked = shuffleOn;
  scb.onchange = function () { shuffleOn = scb.checked; };
  sl.appendChild(scb);
  sl.appendChild(document.createTextNode(' Mezclar preguntas y opciones'));
  c.appendChild(sl);
  var err = null;
  if (msg) { err = el('p', 'err', msg); c.appendChild(err); }
  var act = el('div', 'actions');
  var b = el('button', 'pri', 'Empezar');
  b.onclick = function () {
    if (!EJES.some(function (e) { return sel[e.n]; })) { home('Elegí al menos un eje para empezar.'); return; }
    start();
  };
  act.appendChild(b);
  c.appendChild(act);
  app.appendChild(c);
}

function start() {
  list = buildList();
  idx = 0; score = 0; wrong = [];
  show();
}

function topbar(text) {
  var bar = el('div', 'topbar');
  bar.appendChild(el('p', 'muted', text));
  var back = el('button', 'sec', 'Volver al inicio');
  back.onclick = function () { home(); };
  bar.appendChild(back);
  return bar;
}

function show() {
  answered = false;
  app.innerHTML = '';
  var q = list[idx];
  app.appendChild(topbar('Pregunta ' + (idx + 1) + ' de ' + list.length + ' · Eje ' + q.eje));
  var c = el('div', 'card');
  c.appendChild(el('p', 'stem', q.s));
  q.o.forEach(function (o, i) {
    var b = el('button', '', LET[i] + '. ' + o);
    b.onclick = function () { pick(i); };
    c.appendChild(b);
  });
  app.appendChild(c);
}

function pick(i) {
  if (answered) return;
  answered = true;
  var q = list[idx];
  var btns = app.querySelectorAll('.card button');
  var good = i === q.a;
  if (good) score++; else wrong.push(q);
  btns[q.a].className = 'ok';
  if (!good) btns[i].className = 'bad';
  var card = app.querySelector('.card');
  var text = good
    ? 'Correcta. ' + q.e
    : 'Incorrecta. La respuesta correcta es la ' + LET[q.a] + ': ' + q.o[q.a] + '. ' + q.e;
  card.appendChild(el('div', 'fb ' + (good ? 'ok-f' : 'bad-f'), text));
  var nb = el('button', 'pri', idx < list.length - 1 ? 'Siguiente' : 'Ver resultado');
  nb.onclick = function () { if (idx < list.length - 1) { idx++; show(); } else results(); };
  card.appendChild(nb);
}

function results() {
  app.innerHTML = '';
  app.appendChild(topbar('Práctica finalizada'));
  var c = el('div', 'card');
  var pct = Math.round(100 * score / list.length);
  c.appendChild(el('p', 'stem', score + ' / ' + list.length + ' correctas (' + pct + '%)'));
  if (wrong.length) {
    c.appendChild(el('p', 'muted', 'Para repasar:'));
    wrong.forEach(function (q) {
      var p = el('div', 'wrong');
      p.appendChild(el('p', '', '• [Eje ' + q.eje + '] ' + q.s));
      p.appendChild(el('p', 'muted', 'Respuesta correcta: ' + LET[q.a] + '. ' + q.o[q.a] + '. ' + q.e));
      c.appendChild(p);
    });
  }
  var r = el('button', 'pri', 'Volver al inicio');
  r.onclick = function () { home(); };
  c.appendChild(r);
  app.appendChild(c);
}

home();

</script>
</body>
</html>

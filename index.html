<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parcial teórico · Bases de datos 1 (SQL Server)</title>
<style>
:root { --bg:#fbeef4; --surface:#ffffff; --ink:#3b0a1f; --muted:#7a3b56; --line:#eec3d5; --accent:#9d174d; --accent-ink:#ffffff; --ok:#166534; --ok-bg:#dcf5e4; --bad:#9f1239; --bad-bg:#fde1ea; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#2a0d1c; --surface:#3d1529; --ink:#fbe7f0; --muted:#e0a8c2; --line:#6b2d4d; --accent:#db2777; --accent-ink:#ffffff; --ok:#86efac; --ok-bg:#14402a; --bad:#fda4af; --bad-bg:#5a1a2e; }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',sans-serif; font-size:16px; line-height:1.55; }
main { max-width:720px; margin:0 auto; padding:24px 16px 60px; }
h1 { font-size:1.5rem; margin:0 0 14px; color:var(--accent); }
.card { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:14px; }
.muted { color:var(--muted); font-size:.92rem; }
.stem { font-weight:600; font-size:1.05rem; margin:0 0 14px; }
label.opt { display:flex; gap:8px; align-items:center; margin:8px 0; cursor:pointer; }
input[type=checkbox] { accent-color:var(--accent); width:18px; height:18px; }
button { font:inherit; color:inherit; cursor:pointer; display:block; width:100%; text-align:left; background:transparent; border:1.5px solid var(--line); border-radius:8px; padding:11px 14px; margin-bottom:8px; }
button.pri { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); text-align:center; font-weight:600; width:auto; display:inline-block; }
button.ok { border-color:var(--ok); background:var(--ok-bg); }
button.bad { border-color:var(--bad); background:var(--bad-bg); }
button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
.fb { padding:12px 14px; border-left:5px solid var(--accent); background:var(--bg); border-radius:0 8px 8px 0; margin:10px 0 12px; }
.fb.ok-f { border-left-color:var(--ok); }
.fb.bad-f { border-left-color:var(--bad); }
.wrong p { margin:6px 0; }
.topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; }
.topbar .muted { margin:0; }
button.sec { width:auto; display:inline-block; padding:6px 12px; margin:0; font-size:.9rem; color:var(--muted); border-color:var(--line); }
.sep { border:0; border-top:1px solid var(--line); margin:12px 0; }
.err { color:var(--bad); background:var(--bad-bg); border:1px solid var(--bad); border-radius:8px; padding:8px 12px; font-size:.92rem; margin:10px 0 0; }
.actions { margin-top:14px; }
</style>
</head>
<body>
<main id="app"></main>
<script>
var TOP = [
  ['m', 'Modelo relacional y normalización'],
  ['q', 'SQL: agregación, NULL, JOIN y subconsultas'],
  ['i', 'Índices'],
  ['u', 'Funciones definidas por el usuario (UDF)'],
  ['p', 'Procedimientos almacenados (SP)'],
  ['g', 'Triggers de auditoría'],
  ['tr', 'Transacciones'],
  ['o', 'Optimización'],
  ['sec', 'Seguridad']
];
var QS = [];
function A(t, s, o, a, e) { QS.push({ t: t, s: s, o: o, a: a, e: e }); }
var V = ['Verdadero', 'Falso'];

/* ---------- Modelo relacional y normalización ---------- */
A('m', 'Una desventaja de la desnormalización es:', ['Es una técnica para OLTP (Procesamiento Transaccional en Línea).', 'Genera consultas más complejas.', 'Mayor riesgo de inconsistencia si no se actualizan todas las copias de un dato.', 'La lectura es más lenta.'], 2, 'La desnormalización duplica datos a propósito para acelerar las lecturas. El costo es que, si una actualización no llega a todas las copias, la base queda con valores contradictorios entre sí.');
A('m', 'Los metadatos son hechos brutos sin significado.', V, 1, 'Los hechos brutos son los datos en sí (por ejemplo, un número o un nombre sin contexto). Los metadatos son datos que describen a otros datos: nombres de tablas, tipos de columna, restricciones.');
A('m', 'Una superclave mínima (de la que no se puede quitar ningún atributo sin perder la unicidad) se llama:', ['Clave alternativa', 'Clave primaria (PK, Primary Key)', 'Clave candidata', 'Superclave'], 2, 'Una superclave es cualquier conjunto de atributos que identifica filas de forma única. Si además es mínima, es una clave candidata. Cada clave candidata puede elegirse como clave primaria.');
A('m', '¿Cuál NO describe un esquema de base de datos?', ['Es la colección de datos almacenados en un momento dado.', 'Describe la estructura subyacente de la base.', 'Representa el diseño general de la base.', 'Tiende a ser estático.'], 0, 'Los datos almacenados en un momento dado forman una instancia, que cambia constantemente. El esquema es la estructura (tablas, columnas, relaciones), que casi no cambia.');
A('m', 'La anomalía de borrado implica la pérdida no deseada de datos.', V, 0, 'Una anomalía de borrado ocurre cuando, al eliminar una fila, se pierde información que no debía perderse, porque estaba mezclada con otro hecho en la misma tabla.');
A('m', '¿Cuál NO es una clasificación de atributos en el modelo E-R (Entidad-Relación)?', ['Multivaluados', 'Primarios', 'Derivados', 'Compuestos'], 1, 'Los atributos se clasifican como simples o compuestos, monovaluados o multivaluados, y básicos o derivados. "Primario" no es una clase de atributo: una clave primaria es un rol que puede cumplir un atributo, no una clasificación.');
A('m', '¿Cómo se traduce un atributo multivaluado al modelo relacional?', ['Se ignora.', 'Se mapea a un tipo LIST.', 'Con una nueva tabla cuya PK es la PK de la entidad más el atributo.', 'Con un único campo que concatena los valores.'], 2, 'Una columna no puede guardar varios valores (eso violaría la 1FN, Primera Forma Normal). Cada valor se guarda como una fila en una tabla nueva, con clave compuesta por la PK original y el atributo.');
A('m', 'La FNBC (Forma Normal de Boyce-Codd) garantiza siempre la preservación de las dependencias.', V, 1, 'La FNBC elimina más redundancias que la 3FN (Tercera Forma Normal), pero al hacerlo puede perder dependencias funcionales. La 3FN, en cambio, siempre las preserva.');
A('m', '¿Por qué se recomiendan claves subrogadas (claves artificiales sin significado de negocio)?', ['Sintaxis fuera de línea.', 'Pueden contener NULL y duplicados.', 'Ocupan menos espacio que las naturales.', 'Son estables e inmutables, lo que evita cascadas costosas al cambiar un valor.'], 3, 'Una clave natural (como un DNI o un correo) puede cambiar con el tiempo, y ese cambio debe propagarse a todas las tablas que la referencian. Una clave subrogada, como un número autoincremental, no cambia nunca.');
A('m', 'Al mapear una entidad débil (que no tiene identidad propia sin otra entidad), su clave primaria se forma con:', ['Clave parcial + clave primaria de la entidad fuerte.', 'Clave candidata y atributos no clave.', 'Solo la clave parcial.', 'Solo la clave externa.'], 0, 'La entidad débil se identifica por su clave parcial combinada con la PK de la entidad fuerte de la que depende. Por ejemplo, un ítem de factura sólo tiene sentido dentro de su factura.');
A('m', 'Una función clave de un SGBD (Sistema de Gestión de Bases de Datos) que NO corresponde es:', ['Control de acceso y seguridad (DCL, Lenguaje de Control de Datos).', 'Procesamiento de texto básico.', 'Consulta de datos.', 'Definición de datos (DDL, Lenguaje de Definición de Datos).'], 1, 'Un SGBD se encarga de definir, consultar, controlar y proteger datos. El procesamiento de texto es una función de un editor de documentos, no de un sistema de bases de datos.');
A('m', '¿Quién introdujo el modelo relacional en 1970?', ['Hollerith', 'Bachman', 'Edgar F. Codd', 'Gates'], 2, 'Edgar F. Codd, investigador de IBM, publicó en 1970 el artículo que propone organizar los datos en tablas (relaciones) y consultarlos con álgebra relacional. Es la base de SQL y de casi todos los SGBD actuales.');
A('m', 'Requisito fundamental de la 1FN (Primera Forma Normal):', ['Atributos atómicos y un solo valor por celda.', 'Dependencia funcional completa.', 'Ausencia de dependencias transitivas.', 'Clave primaria compuesta.'], 0, 'La 1FN exige que cada celda contenga un único valor indivisible. La dependencia completa es requisito de la 2FN y la ausencia de dependencias transitivas, de la 3FN.');
A('m', 'En el modelo relacional, una fila se llama:', ['Atributo', 'Tupla', 'Dominio', 'Esquema'], 1, 'La terminología formal es: relación (tabla), tupla (fila), atributo (columna) y dominio (conjunto de valores permitidos para un atributo).');
A('m', 'Restricción que garantiza la integridad referencial:', ['NOT NULL', 'FOREIGN KEY (FK, Clave Foránea)', 'UNIQUE', 'PRIMARY KEY (PK, Clave Primaria)'], 1, 'La integridad referencial exige que cada valor de una clave foránea exista como clave en la tabla referenciada. Así no pueden aparecer pedidos de clientes inexistentes.');
A('m', 'Un atributo compuesto se mapea a una sola columna compuesta.', V, 1, 'Un atributo compuesto (como "domicilio", formado por calle, número y ciudad) se mapea a varias columnas separadas, una por cada componente. Las bases relacionales no tienen columnas que contengan subcolumnas.');
A('m', 'La restricción CHECK limita los valores según una condición booleana.', V, 0, 'CHECK (verificación) permite definir una expresión lógica que cada valor debe cumplir, por ejemplo precio > 0. Si la condición es falsa, la operación se rechaza.');

/* ---------- SQL: agregación, NULL, JOIN y subconsultas ---------- */
A('q', 'Respecto de funciones de agregación con valores NULL, ¿cuál afirmación es INCORRECTA?', ['SUM ignora los NULL.', 'AVG trata NULL como cero e incluye NULL en el denominador.', 'Si un grupo tiene solo NULL, AVG devuelve NULL.', 'COUNT(columna) cuenta solo las filas no NULL.'], 1, 'Las funciones de agregación (SUM, AVG, MIN, MAX, COUNT(columna)) ignoran los NULL: no los suman como cero ni los cuentan en el denominador. Por eso AVG de un grupo sólo NULL es NULL.');
A('q', 'En SQL Server, ¿qué función permite calcular el tiempo transcurrido entre dos fechas?', ['GETDATE()', 'DATEDIFF()', 'FORMAT()', 'CONVERT()'], 1, 'DATEDIFF() calcula la diferencia entre dos fechas en la unidad indicada (días, meses, años). GETDATE() devuelve la fecha actual, FORMAT() y CONVERT() cambian el formato de presentación.');
A('q', 'Las funciones de agregación que pueden aplicarse a columnas de texto son:', ['Ninguna.', 'SUM y AVG.', 'COUNT solo para valores numéricos.', 'MIN y MAX (orden alfabético).'], 3, 'SUM y AVG necesitan números. MIN y MAX funcionan con texto porque comparan según el orden alfabético de la intercalación (collation) de la columna.');
A('q', 'Las funciones escalares (que devuelven un único valor por fila), como YEAR() o RIGHT(), aplicadas directamente en el WHERE permiten:', ['Evaluar condiciones sobre funciones de agregación.', 'Definir la secuencia de presentación del resultado.', 'Filtrar con detalle transformando temporalmente los valores de la columna.', 'Ninguna es correcta.'], 2, 'La función transforma el valor de la columna sólo para evaluar la condición, sin modificar los datos. Hay que tener en cuenta que esto puede impedir el uso de un índice.');
A('q', 'En el OLP (Orden Lógico de Procesamiento) de una consulta, ¿cuál afirmación sobre la cláusula FROM (paso 1) es INCORRECTA?', ['Establece alias de tabla visibles en pasos posteriores.', 'Identifica las fuentes de datos e inicia el producto cartesiano.', 'Proyecta las columnas finales y hace visibles los alias del SELECT en el WHERE.', 'Es el primer paso que se ejecuta.'], 2, 'La proyección de columnas ocurre en el SELECT, que se evalúa después del WHERE. Por eso los alias definidos en el SELECT no pueden usarse en el WHERE.');
A('q', 'Principio que establece otorgar solo el mínimo de permisos necesarios:', ['RBAC (Control de Acceso Basado en Roles).', 'DAC (Control de Acceso Discrecional).', 'Principio del Mínimo Privilegio (PoLP, Principle of Least Privilege).', 'Ninguna es correcta.'], 2, 'PoLP establece que cada usuario o proceso tenga sólo los permisos que necesita para su tarea. RBAC y DAC son modelos de control de acceso, no principios sobre la cantidad de permisos.');
A('q', 'Si se aplica COUNT(columna_email), ¿qué ocurre con los valores NULL?', ['Ninguna es correcta.', 'Cuenta todas las filas, incluso las NULL.', 'Solo cuenta las filas con valor no NULL.', 'Convierte NULL a cero antes de contar.'], 2, 'COUNT(columna) cuenta sólo valores no nulos. COUNT(*) cuenta todas las filas, sin importar sus valores.');
A('q', 'El propósito funcional de TOP / OFFSET-FETCH (equivalentes a LIMIT en otros motores) en el OLP es:', ['Definir el ordenamiento físico en disco.', 'Ninguna es correcta.', 'Filtrar filas con funciones de ventana (window functions).', 'Restringir la cantidad de filas devueltas (último paso del OLP).'], 3, 'Se aplica al final, después del ORDER BY, y limita cuántas filas se entregan. No afecta cómo se guardan los datos ni qué filas cumplen el WHERE.');
A('q', '¿Qué rol cumple la cláusula ON en un JOIN?', ['Ninguna es correcta.', 'Filtrar después de las agregaciones.', 'Definir el orden de procesamiento antes del WHERE.', 'Especificar la condición lógica de emparejamiento entre tablas.'], 3, 'ON indica qué columnas se comparan para emparejar filas de ambas tablas. Filtrar tras agregar es el rol de HAVING, y el orden de procesamiento lo define el OLP.');
A('q', 'Respecto de EXISTS y NOT EXISTS, ¿cuál afirmación es INCORRECTA?', ['NOT EXISTS devuelve filas sin correspondencia en la subconsulta.', 'Son obligatorios cuando hay una subconsulta en el FROM.', 'EXISTS verifica existencia sin requerir columnas específicas.', 'Se pueden usar en WHERE o HAVING.'], 1, 'EXISTS no es obligatorio en ningún lugar. Es un predicado que devuelve verdadero si la subconsulta encuentra al menos una fila, y puede aparecer en WHERE o HAVING.');
A('q', 'Una subconsulta usada con IN debe devolver:', ['Un conjunto de múltiples columnas.', 'Un valor escalar único.', 'Ninguna es correcta.', 'Un conjunto de valores de una sola columna.'], 3, 'IN compara un valor contra una lista. Por eso la subconsulta debe devolver una sola columna, aunque pueda devolver muchas filas.');
A('q', 'Empleados solo cuando tienen departamento asignado: ¿qué JOIN usar?', ['Ninguna es correcta.', 'INNER JOIN.', 'LEFT JOIN.', 'FULL OUTER JOIN.'], 1, 'INNER JOIN devuelve sólo las filas que tienen coincidencia en ambas tablas. Los empleados sin departamento quedan afuera, que es justamente lo pedido.');
A('q', '¿Qué ocurre en un LEFT JOIN cuando la fila de la izquierda no tiene coincidencia?', ['Ninguna es correcta.', 'Se duplica la fila de la derecha.', 'Se incluye la fila de la izquierda y las columnas de la derecha quedan en NULL.', 'Se excluye la fila de la izquierda.'], 2, 'LEFT JOIN conserva todas las filas de la tabla de la izquierda. Las columnas de la tabla derecha, que no tienen coincidencia, aparecen en NULL.');
A('q', 'Para extraer códigos o prefijos de un texto, las funciones adecuadas son:', ['LEN o LENGTH (miden la longitud).', 'SUBSTRING o LEFT (extraen parte del texto).', 'Ninguna es correcta.', 'TRIM o LTRIM (quitan espacios).'], 1, 'SUBSTRING(texto, inicio, largo) y LEFT(texto, n) extraen fragmentos. LEN mide la longitud y TRIM sólo quita espacios.');
A('q', '¿Cómo se llama unir tablas sin condición de JOIN, y cuál es su riesgo?', ['Ninguna es correcta.', 'UNION ALL, con riesgo de duplicados.', 'LEFT JOIN, con riesgo de perder filas.', 'Producto cartesiano, con N×M filas.'], 3, 'Sin condición, cada fila de una tabla se combina con todas las de la otra. Si una tabla tiene N filas y la otra M, el resultado tiene N×M filas, que puede explotar en tamaño.');
A('q', 'En SQL Server, ¿cuál es la restricción más importante impuesta a las UDF (Funciones Definidas por el Usuario)?', ['Ninguna es correcta.', 'No pueden recibir parámetros de entrada.', 'No pueden usar DML (Lenguaje de Manipulación de Datos) sobre tablas persistentes.', 'Deben devolver varios conjuntos de resultados.'], 2, 'Una UDF no puede ejecutar INSERT, UPDATE ni DELETE sobre tablas permanentes. Sólo puede modificar variables tabla locales. Las UDF sí reciben parámetros y devuelven un único valor o una tabla.');

/* ---------- Índices ---------- */
A('i', 'La característica esencial de un índice agrupado (Clustered Index) es:', ['Su nivel hoja contiene una dirección física independiente.', 'Permite 999 índices por tabla.', 'Define el orden físico de almacenamiento de las filas.', 'Ninguna es correcta.'], 2, 'Como las filas de la tabla se guardan en el orden de la clave agrupada, sólo puede haber uno por tabla. Los índices no agrupados (Nonclustered), en cambio, son estructuras separadas que apuntan a las filas.');
A('i', 'El costo operativo principal de la indexación es:', ['Consumo excesivo de caché que bloquea otras consultas.', 'Ninguna es correcta.', 'Recorrido secuencial completo antes de un seek.', 'Mantenimiento del Árbol B+ en cada operación DML.'], 3, 'Cada INSERT, UPDATE o DELETE debe actualizar también los índices afectados, para que sigan ordenados. Por eso demasiados índices penalizan las escrituras.');
A('i', 'Un índice sobre una columna con muy pocos valores distintos (baja selectividad) suele:', ['Mejorar siempre el rendimiento.', 'Ser poco útil, porque el optimizador prefiere recorrer la tabla completa.', 'Impedir los INSERT.', 'Ser obligatorio en SQL Server.'], 1, 'Si el filtro devuelve gran parte de las filas, leer el índice y luego ir a cada fila es más costoso que recorrer la tabla directamente. El optimizador elige el camino más barato.');
A('i', 'Un índice no agrupado (Nonclustered Index) almacena:', ['Las filas completas ordenadas.', 'La clave del índice y un puntero a la fila (RID o la clave agrupada).', 'Solo los datos de tipo texto.', 'Los permisos de la tabla.'], 1, 'Como no define el orden físico de la tabla, necesita un puntero a la fila real: el RID (Identificador de Fila) si la tabla es un heap, o la clave agrupada si existe un índice agrupado.');

/* ---------- UDF ---------- */
A('u', 'La diferencia principal entre una UDF escalar y una UDF table-valued inline (que devuelve una tabla) es que:', ['La inline devuelve un valor escalar.', 'La inline devuelve un conjunto de filas y funciona como una vista parametrizada.', 'La escalar no puede usarse en un SELECT.', 'No hay diferencia.'], 1, 'La UDF escalar devuelve un único valor por invocación. La inline table-valued devuelve un conjunto de filas y puede usarse en el FROM como si fuera una tabla o vista.');
A('u', 'Una UDF en SQL Server puede ejecutar INSERT sobre una tabla permanente:', ['Sí, siempre.', 'Sí, pero solo con TRY-CATCH.', 'No; no puede modificar tablas persistentes.', 'Sí, si es multi-statement.'], 2, 'Las UDF no pueden modificar tablas permanentes ni ejecutar procedimientos almacenados, porque deben comportarse como funciones sin efectos secundarios. Sólo pueden trabajar sobre variables tabla locales.');
A('u', 'Dentro de una UDF no está permitido:', ['Usar variables locales.', 'Ejecutar un procedimiento almacenado con EXEC.', 'Usar SELECT para leer datos.', 'Declarar parámetros de entrada.'], 1, 'Las UDF no pueden invocar procedimientos almacenados con EXEC ni controlar transacciones (BEGIN TRAN, COMMIT). Sí pueden usar variables, leer datos y recibir parámetros.');
A('u', 'Una UDF escalar puede degradar el rendimiento de un SELECT porque:', ['Se evalúa fila por fila.', 'Usa índices agrupados.', 'Se paraleliza automáticamente siempre.', 'Se guarda en caché de resultados.'], 0, 'Se invoca una vez por cada fila del conjunto, lo que genera mucho overhead. Desde SQL Server 2019 algunas UDF pueden "inlinearse" (incorporarse a la consulta) para mitigarlo.');

/* ---------- Procedimientos almacenados ---------- */
A('p', 'Algo que un procedimiento almacenado (SP, Stored Procedure) puede hacer y una UDF escalar no es:', ['Devolver un valor escalar.', 'Devolver múltiples conjuntos de resultados y valores por OUTPUT.', 'Recibir parámetros.', 'Ser invocado desde un SELECT.'], 1, 'Los SP pueden devolver varios result sets, usar parámetros OUTPUT y modificar datos. Las UDF deben devolver un único resultado y no pueden tener efectos secundarios sobre la base.');
A('p', 'La forma correcta de manejar errores en un procedimiento almacenado de SQL Server es:', ['Solo con IF @@ERROR (variable de sistema con el código del último error).', 'Con bloques BEGIN TRY ... BEGIN CATCH.', 'No es posible manejar errores.', 'Solo con triggers.'], 1, 'TRY-CATCH captura los errores y permite revertir la transacción o registrar el problema. IF @@ERROR funciona pero es menos robusto, y las UDF no admiten TRY-CATCH.');
A('p', 'El control transaccional explícito (BEGIN TRAN, COMMIT, ROLLBACK) es:', ['No es posible en un SP.', 'Posible en un SP, pero no en una UDF.', 'Posible solo con CURSOR.', 'Posible solo dentro de una UDF.'], 1, 'Los SP pueden agrupar operaciones en una transacción y confirmarla o revertirla. Las UDF no pueden hacerlo, porque no admiten control transaccional explícito.');
A('p', 'Una ventaja de un procedimiento almacenado frente a consultas ad hoc (escritas en el momento) es:', ['Se recompila siempre en cada llamada.', 'Reutiliza el plan de ejecución y reduce el tráfico de red.', 'No admite parámetros.', 'Evita la necesidad de permisos.'], 1, 'Como el código está guardado en el servidor, el plan de ejecución se reutiliza y el cliente sólo envía el nombre del SP y sus parámetros. Además, centraliza la lógica y permite dar permiso sólo para ejecutarlo.');

/* ---------- Triggers de auditoría ---------- */
A('g', 'Un trigger AFTER se diferencia de un INSTEAD OF en que:', ['AFTER se ejecuta después de la operación; INSTEAD OF la reemplaza.', 'Son idénticos.', 'INSTEAD OF solo funciona con SELECT.', 'AFTER no tiene acceso a las tablas inserted y deleted.'], 0, 'Un trigger AFTER se dispara una vez completada la sentencia DML (INSERT, UPDATE o DELETE), por lo que suele usarse para auditoría. Un INSTEAD OF ejecuta su lógica en lugar de la sentencia original, y se usa, por ejemplo, para vistas.');
A('g', 'En un trigger de SQL Server, las tablas inserted y deleted contienen:', ['Las filas afectadas por la operación DML.', 'Logs de todas las bases de datos.', 'Vistas permanentes de auditoría.', 'Índices de la tabla.'], 0, 'inserted contiene las filas nuevas (tras INSERT o UPDATE) y deleted las filas anteriores (tras UPDATE o DELETE). Son tablas temporales válidas sólo dentro del trigger.');
A('g', 'Para una tabla de auditoría, lo más completo a registrar es:', ['Solo el nuevo valor.', 'Usuario, fecha, tipo de operación, valores anteriores y valores nuevos.', 'Solo la fecha.', 'Nada: el log lo hace SQL Server solo.'], 1, 'Registrar el antes y el después, junto con quién y cuándo hizo el cambio, permite reconstruir el historial completo y detectar accesos indebidos.');
A('g', 'Un riesgo de los triggers de auditoría es que:', ['Siempre mejoran el rendimiento.', 'Ocultan lógica y aumentan el costo de cada DML.', 'No pueden usar SYSTEM_USER.', 'No pueden desactivarse.'], 1, 'Son lógica oculta que se ejecuta en cada operación, lo que puede sorprender a quien desarrolla y encarece las escrituras. SQL Server Audit es una alternativa nativa para auditar sin esa lógica.');

/* ---------- Transacciones ---------- */
A('tr', 'En ACID (Atomicidad, Consistencia, Aislamiento y Durabilidad), la atomicidad garantiza que:', ['Las operaciones de la transacción se ejecutan todas o ninguna.', 'Hay aislamiento total entre sesiones.', 'Los datos persisten tras una caída.', 'Se respetan las claves foráneas.'], 0, 'Una transacción es una unidad indivisible: si una de sus operaciones falla, se revierten todas. El aislamiento, la durabilidad y la consistencia son las otras propiedades de ACID.');
A('tr', 'El nivel de aislamiento por defecto en SQL Server es:', ['READ UNCOMMITTED.', 'READ COMMITTED.', 'Ninguno.', 'SERIALIZABLE.'], 1, 'READ COMMITTED impide leer datos que otra transacción aún no confirmó (lecturas sucias). READ UNCOMMITTED no ofrece esa protección y SERIALIZABLE es el nivel más estricto, pero no el predeterminado.');
A('tr', 'Un deadlock (interbloqueo) ocurre cuando:', ['Dos sesiones se bloquean mutuamente esperando recursos que la otra tiene.', 'Un SELECT tarda mucho.', 'Un índice está fragmentado.', 'Hay un error de sintaxis.'], 0, 'Cada sesión espera un recurso que la otra retiene y ninguna puede avanzar. SQL Server detecta el ciclo y termina una de las dos transacciones como víctima.');
A('tr', 'SET XACT_ABORT ON hace que:', ['Ante la mayoría de los errores en tiempo de ejecución se revierta automáticamente la transacción.', 'Se desactiven las transacciones.', 'Solo afecte a los SELECT.', 'Se confirme todo al final.'], 0, 'Sin esta opción, un error puede dejar la transacción abierta o parcialmente aplicada. Con XACT_ABORT ON, SQL Server la revierte automáticamente, lo que es recomendable dentro de SP.');

/* ---------- Optimización ---------- */
A('o', 'Plan de ejecución estimado vs real:', ['El estimado se calcula sin ejecutar; el real incluye las filas efectivamente procesadas.', 'Son siempre idénticos.', 'El real no existe en SQL Server.', 'El estimado usa caché de resultados.'], 0, 'El plan estimado muestra lo que el optimizador espera hacer según las estadísticas. El plan real se obtiene al ejecutar y muestra cuántas filas procesó en realidad. Diferencias grandes indican estadísticas desactualizadas.');
A('o', 'La diferencia entre Index Seek y Index Scan es que:', ['Seek recorre toda la tabla.', 'Scan lee solo una porción por índice.', 'Seek usa el árbol B+ para ir directo a las filas; Scan lee todo el índice o la tabla.', 'No hay diferencia.'], 2, 'Un Seek navega el árbol B+ (Árbol Balanceado B+) para llegar sólo a las filas necesarias. Un Scan recorre todas las filas del índice o de la tabla, lo que es más costoso cuando se busca poca cantidad.');
A('o', 'Un predicado es SARGable (Search ARGument able, que permite buscar con índice) cuando:', ['Permite usar un índice, por ejemplo WHERE columna >= valor sin funciones sobre la columna.', 'Usa YEAR(columna) en el WHERE.', 'Usa LIKE con comodín al inicio.', 'Cualquier predicado lo es.'], 0, 'Si la columna aparece sola frente al valor, el motor puede buscar directamente en el índice. Con una función sobre la columna, o con LIKE que empieza con comodín, debe leer todas las filas.');
A('o', 'Parameter sniffing puede causar problemas de rendimiento porque:', ['Un plan optimizado para un valor de parámetro puede ser ineficiente para otro.', 'Un índice faltante genera un error.', 'Solo afecta a los INSERT.', 'Es una técnica de seguridad.'], 0, 'SQL Server compila el plan con el primer valor de parámetro que recibe y lo reutiliza. Si luego llega un valor con distribución de datos muy distinta, ese plan puede ser lento. Existen opciones como OPTION (RECOMPILE) para mitigarlo.');

/* ---------- Seguridad ---------- */
A('sec', 'La práctica recomendada en SQL Server para asignar permisos es:', ['Dar db_owner a todos los usuarios.', 'Asignar permisos a roles y organizar objetos por esquemas.', 'Usar siempre la cuenta sa.', 'Dar permisos usuario por usuario, sin roles.'], 1, 'Los roles agrupan permisos y simplifican la administración: al cambiar el rol, cambian todos sus miembros. Los esquemas separan los objetos por función. Ambos ayudan a aplicar el principio de mínimo privilegio.');
A('sec', 'Ownership chaining (encadenamiento de propiedad) permite que:', ['Un procedimiento acceda a tablas sin permiso directo sobre ellas, si comparte dueño con el objeto.', 'Esté prohibido ejecutar procedimientos.', 'Solo funcione con UDF.', 'Requiera el rol sysadmin.'], 0, 'Si un SP y las tablas que usa tienen el mismo dueño, SQL Server no verifica los permisos sobre las tablas al ejecutarse el SP. Así se expone una operación sin dar acceso directo a los datos.');
A('sec', 'La forma de prevenir inyección SQL es:', ['Usar parámetros en lugar de concatenar la entrada del usuario en la consulta.', 'Usar TRY-CATCH.', 'Crear más índices.', 'Usar DISTINCT.'], 0, 'La inyección SQL ocurre cuando texto ingresado por el usuario se interpreta como código SQL. Los parámetros separan los datos del código, de modo que el texto nunca se ejecuta como instrucción.');
A('sec', 'Transparent Data Encryption (TDE, Cifrado Transparente de Datos) protege:', ['Los archivos de datos y de log en reposo.', 'El tráfico de red entre cliente y servidor.', 'Los permisos de los usuarios.', 'Solo los backups.'], 0, 'TDE cifra los archivos físicos de la base sin cambios en las aplicaciones. Para proteger el tráfico de red se usa TLS (Seguridad de la Capa de Transporte).');

/* ---------- App ---------- */
var sel = {};
TOP.forEach(function (t) { sel[t[0]] = true; });
var doShuffle = true;
var list, idx, score, wrong, answered;

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i];
    a[i] = a[j];
    a[j] = tmp;
  }
  return a;
}

function prepareQuestion(q) {
  if (!doShuffle || q.o === V) {
    return { t: q.t, s: q.s, o: q.o.slice(), a: q.a, e: q.e };
  }
  var tagged = q.o.map(function (text, idx) { return { text: text, ok: idx === q.a }; });
  tagged = shuffle(tagged);
  var newCorrect = 0;
  var newOpts = tagged.map(function (item, idx) {
    if (item.ok) newCorrect = idx;
    return item.text;
  });
  return { t: q.t, s: q.s, o: newOpts, a: newCorrect, e: q.e };
}

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
var app = document.getElementById('app');

function home() {
  app.innerHTML = '';
  app.appendChild(el('h1', '', 'Parcial teórico · Bases de datos 1 (SQL Server)'));
  var c = el('div', 'card');
  c.appendChild(el('p', 'muted', 'Elegí los temas y respondé una opción por pregunta.'));
  var errBox = null;

  TOP.forEach(function (t) {
    var n = QS.filter(function (x) { return x.t === t[0]; }).length;
    var l = el('label', 'opt');
    var cb = el('input');
    cb.type = 'checkbox';
    cb.checked = sel[t[0]];
    cb.onchange = function () {
      sel[t[0]] = cb.checked;
      if (errBox && cb.checked) { errBox.remove(); errBox = null; }
    };
    l.appendChild(cb);
    l.appendChild(document.createTextNode(' ' + t[1] + ' (' + n + ')'));
    c.appendChild(l);
  });

  c.appendChild(el('hr', 'sep'));

  var sl = el('label', 'opt');
  var scb = el('input');
  scb.type = 'checkbox';
  scb.checked = doShuffle;
  scb.onchange = function () { doShuffle = scb.checked; };
  sl.appendChild(scb);
  sl.appendChild(document.createTextNode(' Mezclar preguntas y opciones'));
  c.appendChild(sl);

  var act = el('div', 'actions');
  var b = el('button', 'pri', 'Empezar');
  b.onclick = function () {
    var picked = QS.filter(function (x) { return sel[x.t]; });
    if (!picked.length) {
      if (!errBox) {
        errBox = el('p', 'err', 'Elegí al menos un tema para empezar.');
        c.appendChild(errBox);
      }
      return;
    }
    start(picked);
  };
  act.appendChild(b);
  c.appendChild(act);
  app.appendChild(c);
}

function start(picked) {
  var ordered = doShuffle ? shuffle(picked) : picked.slice();
  list = ordered.map(prepareQuestion);
  idx = 0; score = 0; wrong = [];
  show();
}

function show() {
  answered = false;
  app.innerHTML = '';
  var q = list[idx];
  var bar = el('div', 'topbar');
  bar.appendChild(el('p', 'muted', 'Pregunta ' + (idx + 1) + ' de ' + list.length));
  var back = el('button', 'sec', 'Volver al inicio');
  back.onclick = home;
  bar.appendChild(back);
  app.appendChild(bar);

  var c = el('div', 'card');
  c.appendChild(el('p', 'stem', q.s));
  q.o.forEach(function (o, i) {
    var b = el('button', '', String.fromCharCode(97 + i) + '. ' + o);
    b.onclick = function () { pick(i); };
    c.appendChild(b);
  });
  app.appendChild(c);
}

function pick(i) {
  if (answered) return;
  answered = true;
  var q = list[idx];
  var card = app.querySelector('.card');
  var btns = card.querySelectorAll('button');
  var good = i === q.a;
  if (good) score++; else wrong.push(q);
  btns[q.a].className = 'ok';
  if (!good) btns[i].className = 'bad';
  var text = good
    ? 'Correcta. ' + q.e
    : 'Incorrecta. La respuesta correcta es la ' + String.fromCharCode(97 + q.a) + ': ' + q.o[q.a] + '. ' + q.e;
  card.appendChild(el('div', 'fb ' + (good ? 'ok-f' : 'bad-f'), text));
  var nb = el('button', 'pri', idx < list.length - 1 ? 'Siguiente' : 'Ver resultado');
  nb.onclick = function () { if (idx < list.length - 1) { idx++; show(); } else results(); };
  card.appendChild(nb);
}

function results() {
  app.innerHTML = '';
  app.appendChild(el('h1', '', 'Resultado'));
  var c = el('div', 'card');
  c.appendChild(el('p', 'stem', score + ' / ' + list.length + ' correctas'));
  if (wrong.length) {
    c.appendChild(el('p', 'muted', 'Para repasar:'));
    wrong.forEach(function (q) {
      var p = el('div', 'wrong');
      p.appendChild(el('p', '', '• ' + q.s));
      p.appendChild(el('p', 'muted', 'Respuesta correcta: ' + q.o[q.a] + '. ' + q.e));
      c.appendChild(p);
    });
  }
  var r = el('button', 'pri', 'Volver al inicio');
  r.onclick = home;
  c.appendChild(r);
  app.appendChild(c);
}

home();
</script>
</body>
</html>
